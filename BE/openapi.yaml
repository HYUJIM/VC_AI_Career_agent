  /api/v1/public/shares/{token}:
    get:
      tags: [shares]
      summary: 기업용 조회 (공유 링크, 로그인 불필요)
      description: |
        공유 링크로 열람한다. 열 때 **서명 원본을 다시 검증**해서 지금 상태를 보여 준다.
        발급기관마다 다른 표기를 같은 형식(`SharedCredential`)으로 정리해 보여 주고,
        기업이 직접 검증할 수 있게 서명 원본(`vc_jwt`)도 함께 준다. 학생 이메일은 보여 주지 않는다.
        없는 링크·철회된 링크·만료된 링크는 모두 같은 404다(철회·만료는 바로 반영).

        로그인 없는 조회라 검증기 호출 양을 묶는다.
        - 같은 서명 원본은 서버 프로세스(태스크)마다 60초 동안 검증기에 다시 묻지 않고 그때 응답을 다시 쓴다.
          `credentials[].verified_at`이 실제로 검증기에 물은 시각이라 최대 60초 전일 수 있고, 발급기관의 폐기가 최대 60초 늦게 보인다.
          만료는 매번 지금 시각으로 판단하고, 검증기 오류는 다시 쓰지 않는다(다음 조회에서 다시 물음).
        - 새로 부르는 검증기 호출은 태스크마다 분당 300번까지다. 이번 조회에 필요한 호출이 남은 몫보다 많으면 검증기를 부르지 않고
          503 + `Retry-After`로 답한다 (이 응답도 열람 수에는 들어간다).
        - 검증 결과는 학생 지갑(DB 사본의 `status`·`raw_data`·검증 기록)에 저장하지 않는다. 열람 수(`view_count`·`last_viewed_at`)만 올린다.

        링크 토큰은 URL 경로에 들어간다. BE 접근 로그는 `/api/v1/public/shares/[redacted]`로 가리지만, 앞단 프록시·CDN 접근 로그와
        브라우저 기록에는 남을 수 있다.
      operationId: getPublicShare
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicShare"
        "404":
          description: 없거나 철회·만료된 링크
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Share link not found or expired
        "503":
          description: |
            기업용 조회의 검증기 호출 한도(태스크마다 분당 300번, 최근 60초 안에 확인한 원본은 세지 않음)를 넘음.
            검증기를 부르지 않고 끝난다. `Retry-After`(초) 뒤에 다시 연다.
          headers:
            Retry-After:
              description: 다시 열 수 있을 때까지의 초
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Share verification is busy. Try again later.

