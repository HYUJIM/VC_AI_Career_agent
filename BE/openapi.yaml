openapi: 3.1.0
info:
  title: VC AI Career Agent — BE API
  version: 0.8.0
  description: |
    BE(FastAPI) 파트의 OpenAPI 명세. FE(`FE/src/api/*.ts`, `FE/src/types/api.ts`)가 실제로 호출하는
    계약을 기준으로 작성했다.

    ## 아키텍처: BFF (Backend For Frontend)
    BE는 DXWorks API(발급/검증)를 내부에서 호출하고, 그 결과를 자체 DB(PostgreSQL)에 저장한 뒤
    FE가 바로 쓸 수 있는 형태로 조립해서 응답한다.

    ## 응답/에러 규칙
    - 성공 응답 중 쓰기 계열(`register`, `login`, `verify`, `mock-issuer/issue`)은
      `{ success, message, ... }` 봉투(envelope)를 쓴다. 조회 계열(`careers`)은 봉투 없이 본문을 바로 반환한다.
    - 에러는 FastAPI 기본 형식 `{ "detail": "..." }` 으로 반환한다.
      FE는 `detail → message → error` 순서로 메시지를 읽는다 (`FE/src/lib/apiClient.ts`).
    - AI 서비스 연동 오류(직무 비교·커리큘럼 API)와 발급·검증 인프라(DXWorks)·소셜 로그인(Google·GitHub·네이버) 오류에만 기계용 사유 코드
      `code`가 더 붙는다: `{ "detail": "...", "code": "..." }`. AI 연동 오류의 상태 코드와 `detail`은 그대로다.
    - 요청 검증 실패는 422 `{ "detail": [ { "type", "loc", "msg" } ] }`다. FastAPI 기본 형식에서 입력값(`input`)과 `ctx`를
      뺀 것이다: 받은 값을 되돌려 주지 않는다. 오류는 앞에서부터 20개까지만 싣고, `loc`에 들어가는 키 이름이 64자를 넘으면
      `<long key>`로 바꾸며, 본문은 항상 ASCII다(한글·짝 없는 서로게이트는 `\uXXXX` 이스케이프).
      DB에 저장할 수 없는 문자열이 가입 이름·이메일,
      로그인 이메일, 검증 `token`, 모의 발급 필드, 공유 `label`, 포트폴리오 제목·희망 직무에 있으면 422이고 `loc`은 그 필드다.
      NUL(`\u0000`)은 `Value error, must not contain NUL or unpaired surrogate characters`(`type: value_error`),
      짝 없는 서로게이트(예: JSON `\ud800`)는 FastAPI(pydantic) 기본 메시지
      `Input should be a valid string, unable to parse raw data as a unicode string`(`type: string_unicode`)이다.
      DID 경로의 NUL(`%00`)은 첫 메시지의 422(`loc: ["path", "did"]`)이고, 그 밖의 입력이 DB 단계에서 같은 이유로 걸려도
      첫 메시지의 422(`loc: []`)다. 한 줄 필드(가입 이름·이메일, 포트폴리오 제목·희망 직무, 공유 링크 이름)의 앞뒤 공백을 자른
      값 안에 줄바꿈·탭 같은 제어 문자, U+2028·U+2029, 글자 방향 제어·보이지 않는 서식 문자(Unicode Cf 전부: U+202E·U+200B·
      U+FEFF·소프트 하이픈 U+00AD·태그 문자 U+E0000대 등), 빈칸처럼 보이는 글자(U+115F·U+1160·U+3164·U+FFA0·U+2800), 폭 0으로
      그려지는 그 밖의 Default_Ignorable 글자(U+17B4·U+17B5·U+2065·U+FFF0–U+FFF8·U+E0000–U+E00FF·U+E01F0–U+E0FFF)가 있거나,
      비어 있지 않은데 보이는 글자(문자·숫자·문장부호·기호)가 하나도 없으면
      `Value error, must be a single line without control characters`로 422다 (서식 문자 중 이모지 결합 문자 ZWJ U+200D만 받는다.
      그래서 태그 문자로 만드는 지역 깃발 이모지는 받지 않는다).
    - 요청 본문 상한은 경로에 따라 네 가지다 (v0.8.0에서 기본 상한을 2 MiB에서 64 KiB로 낮췄다).
      기본 64 KiB(65,536바이트): 아래에 없는 모든 경로·메서드.
      16 KiB(16,384바이트): 토큰 없이 부르는 `POST /api/v1/users/register`, `POST /api/v1/users/login`,
      `POST /api/v1/users/oauth/google/callback`, `POST /api/v1/users/oauth/github/callback`, `POST /api/v1/users/oauth/naver/callback`.
      320 KiB(327,680바이트): `POST /api/v1/verify` (`token`이 256 KiB까지).
      2 MiB(2,097,152바이트): `POST /api/v1/research/job-postings/preview`, `POST /api/v1/research/job-postings`,
      `POST /api/v1/research/learning-resources`.
      `Content-Length`가 그 경로의 상한보다 크면 인증과 관계없이 본문을 읽지 않고 413 텍스트 `Content Too Large`로 답한다
      (본문을 받지 않는 API는 처리한 뒤 응답만 413으로 바뀐다). `Content-Length` 없는 chunked 전송은 읽은 양이 상한을 넘는 순간
      413 `{ "detail": "Content Too Large" }`로 끊는다(본문을 받지 않는 API는 본문을 읽지 않으므로 413 없이 그대로 처리한다).
      413의 형식은 네 상한 모두 같다. 각 경로의 가장 큰 정상 본문(소셜 로그인 콜백 약 6.3 KB, 커리큘럼 요청 약 35 KB,
      공고 반입 약 1.75 MiB)은 그 경로의 상한 안이다.
    - 끝에 `/`가 붙은 경로(예: `/api/v1/portfolios/`)는 리다이렉트하지 않고 404다. 줄바꿈으로 끝나는 경로
      (예: `/api/v1/users/login%0A`)도 어느 API로도 보내지 않고 404 `{ "detail": "Not Found" }`다.
    - DXWorks 호출 실패는 502 `{ "detail": "Credential service error", "code": "PROVIDER_ERROR" }`, 설정 누락·사용 불가
      (`DXWORKS_API_HOST`가 없거나 `https://` 주소가 아님, API 키·기본 템플릿 ID 없음)는 503
      `{ "detail": "Credential service is not configured", "code": "PROVIDER_NOT_CONFIGURED" }`이다.
      협력사 오류 코드·메시지와 빠진 설정 이름은 응답에 싣지 않고 BE 로그(`Provider error: ...`)에만 남긴다.
      소셜 로그인 API(`/api/v1/users/oauth/{google,github,naver}/*`)의 같은 경우는 상태 코드와 `code`는 같고 문구만 다르다:
      502 `{ "detail": "<Label> OAuth error", "code": "PROVIDER_ERROR" }`,
      503 `{ "detail": "<Label> OAuth is not configured", "code": "PROVIDER_NOT_CONFIGURED" }` (`<Label>`은 `Google`·`GitHub`·`Naver`).
      그 외 내부 오류는 500 `Internal server error` (내부 예외 메시지는 응답에 싣지 않는다).
    - 직무 비교·포트폴리오 생성 중 재검증에서 검증기 장애(설정 누락·연결 실패·시간 초과·5xx·408·429·401·403·3xx)가 나면
      결과를 저장하지 않고 502/503으로 답한다. 특정 자격증명에 대한 거절(400·404·422 등)과 형식이 틀린 2xx는 그 자격증명만
      제외한다. 다만 서명 원본이 둘 이상인데 하나도 빠짐없이 검증기 오류로 끝났으면 장애로 보고 502로 답한다.
      장애가 한 번 확인되면 그 요청의 남은 자격증명은 검증기를 부르지 않고 같은 사유(`verifier_error`)로 제외한다.
    - DXWorks 호출 양 제한: 로그인 사용자(와 서비스 키)가 검증기를 부르는 API(`POST /api/v1/verify`, 재검증, 근거 조회,
      포트폴리오 생성, 직무 비교)는 부르기 전에 필요한 호출 수만큼 몫을 가져간다. 호출자마다 분당 120번과 시간당 1,200번,
      서버 프로세스(태스크) 전체로 분당 600번이며, 하나라도 모자라면 검증기를 한 번도 부르지 않고
      429 `Too many verification requests. Try again later.` + `Retry-After`(초)로 답한다 (`TooManyVerifications`).
      `Retry-After`는 모자란 몫들이 다시 찰 때까지의 시간 가운데 가장 긴 값이다. 한 요청이 한도보다 많이 필요하면(자격증명이
      아주 많은 사용자) 몫이 가득 찼을 때 한 번 받아 주고 그만큼 다음 요청이 늦어진다.
      배지 검증(`POST /api/v1/verify`의 `type: badge`)은 검증기까지 가서 그 토큰이 거절된 요청을 호출자마다
      10분에 10번까지만 받고, 넘으면 검증기를 부르지 않고 같은 429 + `Retry-After`로 답한다 (`POST /api/v1/verify` 참고).
      기업용 조회(공유 링크)는 자기 한도(503)를 따로 쓴다.
      협력사에 동시에 보내는 요청은 프로세스마다 16개까지다. 협력사 응답은 1 MiB까지만 받고(`gzip`·`deflate`로 온 응답은
      전송된 크기와 풀어낸 크기 각각 1 MiB까지, 그 밖의 압축 방식은 받지 않는다), 시간은 교환(연결·전송·본문 수신. 연결 재시도
      포함)이 `DXWORKS_TIMEOUT_SECONDS`의 2배까지, 그 전에 동시 호출 자리를 기다리는 시간도 2배까지다(호출 한 번은 최악의 경우 4배).
    - DB가 바쁠 때: 서버 프로세스(태스크)는 DB 연결을 동시에 `DB_MAX_CONNECTIONS`개(기본 20)까지만 연다. 요청이 몰려 연결 자리를
      5초 안에 얻지 못했거나, DB 문장이 15초를 넘거나 잠금을 5초 안에 얻지 못하면(잠긴 테이블·느린 쿼리) 500 대신
      503 `{ "detail": "Service is busy. Try again later." }` + `Retry-After`(초)로 답한다 (`ServiceBusy`).
      DB를 쓰는 모든 API에 해당하므로 경로별 응답 목록에는 따로 적지 않는다 (`/health`는 DB를 쓰지 않는다).
    - 사용자별 상한: 유효한(철회·만료되지 않은) 공유 링크 100개, 포트폴리오 100개. 넘으면 만들지 않고 409다
      (`Share link limit reached. Revoke unused links first.` / `Portfolio limit reached.`).
      목록 조회(`GET /api/v1/shares`, `GET /api/v1/portfolios`)는 한 번에 200개까지 돌려준다.
    - AI 서비스로 보내는 묶음 요청(공고 검색·직무 비교·학습자료 검색·커리큘럼 계획: 검토된 공고·학습자료 전체를 싣는다)은
      프로세스마다 동시에 `AI_MAX_CONCURRENCY`개(기본 4)까지다. 자리가 10초 안에 나지 않으면 AI를 부르지 않고 503
      `{ "detail": "AI service is busy. Try again later.", "code": "AI_SERVICE_BUSY" }` + `Retry-After`(초)로 답한다.
      자리를 쥔 채로는 검증기(DXWorks)를 부르지 않는다: 직무 비교는 자격증명 재검증을 마친 뒤에 자리를 잡는다.
      사용자마다도 묶는다: 한 사용자가 동시에 쥐는 자리는 2개, 묶음 요청 수는 분당 30번·시간당 300번까지다. 넘으면 기다리지 않고
      DB·AI를 부르지 않은 채 429 `{ "detail": "Too many analysis requests. Try again later." }` + `Retry-After`(초)다.
    - 사용자별 24시간 저장 상한: 직무 비교 200건, 학습 계획 200건(같은 `idempotency_key`로 다시 받는 계획은 세지 않는다),
      LLM 모드 학습 계획 `CURRICULUM_LLM_DAILY_LIMIT`건(기본 20. 외부 LLM까지 간 실패한 시도도 센다). 넘으면 검증기·AI·LLM을
      부르지 않고 429 + `Retry-After`(초)다 (`Daily career analysis limit reached. Try again later.` /
      `Daily curriculum limit reached. Try again later.` /
      `Daily LLM curriculum limit reached. Use the template mode or try again later.`).
    - 모든 응답에 `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`,
      `X-Frame-Options: DENY`, `Content-Security-Policy: frame-ancestors 'none'`이 붙고, 서버가 `APP_ENV=production`이면
      `Strict-Transport-Security: max-age=31536000`도 붙는다 (CORS 사전 요청(OPTIONS) 응답은 제외).

    ## 인증
    이메일 + 비밀번호(bcrypt)로 로그인하면 JWT 액세스 토큰(`access_token`)을 준다.
    이후 요청은 `Authorization: Bearer <access_token>` 헤더를 붙인다.

    요청 주체는 두 가지다.
    - **사용자 토큰**: 본인 DID의 데이터만 읽고 쓸 수 있다. 남의 DID면 403.
    - **서비스 키** (`X-Service-Key`): 선택 사항인 내부 서비스용 키(현재 쓰는 곳 없음). 모든 DID의 `careers`·`evidence` 읽기만 가능하고,
      `POST /api/v1/verify`는 403, 그 밖의 API는 401이다.

    토큰도 서비스 키도 없으면 서버 설정과 관계없이 401 `Authentication required` + `WWW-Authenticate: Bearer`다
    (`Bearer`가 아닌 `Authorization`, 예: Basic도 토큰 없음으로 본다). 토큰 없이 부를 수 있는 API는 `security: []`로 표시한 것
    (회원가입·로그인·소셜 로그인·`/health`·공유 링크 조회)과 API 문서(`/docs`, `/redoc`, `/openapi.json`)뿐이다.
    API 문서는 `APP_ENV=development`에서만 제공한다 (`APP_ENV=production`에서는 세 경로 모두 404).

    사용자 토큰은 서명·만료와 함께 `ver` 클레임이 계정의 현재 토큰 버전(`users.token_version`)과 같아야 받는다.
    로그아웃(`POST /api/v1/users/logout`)하면 버전이 올라가 그 계정에 발급한 토큰이 모두(다른 탭·브라우저·기기 포함)
    401 `Invalid token`이 된다. 계정이 없어진 토큰도 401 `Invalid token`, 만료된 토큰은 401 `Token expired`다.
    `ver`가 없는 예전 토큰은 0으로 본다. 토큰 수명은 서버 `JWT_EXPIRES_MINUTES`(1~1440분, 기본 1440)다.
    같은 이메일로 15분 안에 10번 로그인에 실패하면 그 이메일의 로그인은 429(`Retry-After`)다 (`POST /api/v1/users/login` 참고).

    ## 소셜 로그인 (Google·GitHub·네이버 OAuth 2.0)
    제공자(`google`·`github`·`naver`)마다 고정 경로 세 개가 있다: `GET /api/v1/users/oauth/<제공자>/authorize`,
    `POST /api/v1/users/oauth/<제공자>/callback`(SPA용), `GET /api/v1/users/oauth/<제공자>/callback`(development 전용, production 404).
    모두 토큰 없이 부르고 요청·응답 형식(`OAuthAuthorizeResponse`, `OAuthCallbackRequest`, `AuthResponse`)이 같다.
    제공자 설정(`<GOOGLE|GITHUB|NAVER>_CLIENT_ID`·`_CLIENT_SECRET`)이 없으면 그 제공자만 503 `<Label> OAuth is not configured`다
    (`<Label>`은 `Google`·`GitHub`·`Naver`).
    - 이메일: 제공자가 이메일을 주지 않으면(동의 거절, GitHub 이메일 권한 `user:email` 거절 등) 400 `OAuth email is required`다.
      Google·GitHub는 제공자가 인증한 이메일만 받는다(아니면 400 `OAuth email is not verified`. GitHub는 기본(primary) 이메일만 쓰고
      그 이메일이 인증돼 있어야 한다). 네이버는 인증 여부를 알리지 않으므로 막지 않고 인증되지 않은 이메일로 본다.
    - 계정 규칙 (계정은 이메일 하나에 하나, 이메일은 대소문자를 구분하지 않는다):
      1. 이 제공자 계정(Google `sub`, GitHub 사용자 `id`, 네이버 `id`)이 이미 연동된 계정이 있으면 그 계정으로 로그인한다
         (제공자 쪽 이메일이 바뀌어도 같은 계정).
      2. 같은 이메일의 계정이 없으면 관리형 `did:key`(또는 임시 DID)를 발급해 비밀번호 없는 계정으로 가입시킨다(제공자와 관계없이).
      3. 같은 이메일의 계정이 있으면 차례로: 같은 제공자의 다른 계정이 이미 연동되어 있으면 409
         `User is already linked to another account for this provider`(같은 제공자 계정의 로그인이 동시에 들어와 한쪽이 먼저
         연동을 마친 경우는 409가 아니라 그 계정의 로그인), 비밀번호가 있으면 연동하지 않고 409
         `This email is registered with a password. Log in with your email and password.`(가입은 이메일 소유를 확인하지 않으므로,
         남의 주소로 먼저 가입해 둔 계정에 그 주소의 주인을 넣지 않는다). 그 밖에는 이번 이메일이 인증됐고(Google·GitHub) 그 계정에
         같은 이메일의 Google 또는 GitHub 연동이 있을 때만 연동하고, 아니면 409
         `This email is already used by another sign-in method. Log in with that method.`다 (네이버 로그인은 같은 이메일의 기존
         계정에 붙지 않고, 네이버로 만든 계정에는 다른 제공자가 붙지 않는다).
    - 콜백은 `state`(서명·만료·제공자)와 `redirect_uri` 일치를 확인한 요청만 제공자의 토큰 엔드포인트로 보낸다. 그 호출은 서버
      프로세스(태스크)마다 제공자별로 분당 300번까지이고, 넘으면 제공자를 부르지 않고 429 `Too many attempts. Try again later.` +
      `Retry-After`다 (`TooManyOAuthExchanges`. 한 제공자에 몰아 보내도 다른 제공자는 막히지 않는다).
    - 성공 `message`: 가입 `<Label> OAuth 회원가입 및 로그인 완료`, 연동 `기존 계정에 <Label> 계정 연동 및 로그인 성공`, 그 밖
      `<Label> OAuth 로그인 성공` (FE가 `회원가입`·`연동` 포함 여부로 환영 안내를 고른다). `GET /api/v1/users/me`의 `oauth_providers`는
      연동된 제공자 이름을 이름순으로 돌려준다.

    ## 실행 시점 재검증 준비 (v0.4.0)
    배지 검증 시(검증기가 발급자 서명·신뢰를 확인한 배지만 저장) 서명된 원본 VC-JWT를 `credentials.raw_token`에,
    점검 항목 8개를 `verification_checks`에 저장한다.
    (논문 RAG-VC: DB 사본이 아닌 서명 원본을 다시 검증하기 위한 전제)
  contact:
    name: BE 파트

servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버 (docker compose). FE 개발 서버는 `/api` 프록시로 이 주소에 연결한다.

# 기본은 사용자 토큰 (info.description "인증" 참고). 토큰 없이 부를 수 있는 API는 operation에 security: []로 표시한다.
security:
  - bearerAuth: []

tags:
  - name: health
    description: 서버 상태 확인
  - name: users
    description: 회원가입 / 로그인 / 로그아웃
  - name: careers
    description: AI/FE용 사용자 프로필 + 자격증명 조회
  - name: verify
    description: 자격증명 검증 후 저장
  - name: mock-issuer
    description: 테스트용 모의 배지 발급
  - name: reverify
    description: 실행 시점 재검증 (저장된 서명 원본을 요청 시점에 다시 검증)
  - name: portfolios
    description: 검증된 자격증명만으로 만드는 포트폴리오 (VC_ONLY)
  - name: shares
    description: 선택 공개 링크와 기업용 조회
  - name: career
    description: 직무 비교·커리큘럼 (계산은 AI 서비스 `ai/`, 증거·저장·권한은 BE)

paths:
  /health:
    get:
      tags: [health]
      summary: 서버 상태 확인
      description: |
        인증 없이 프로세스가 떠 있는지만 답한다 (DB·외부 서비스는 확인하지 않는다). 워커 스레드를 쓰지 않고 이벤트 루프에서
        바로 답하므로, DB 연결 자리나 잠금을 기다리는 요청이 몰려 있어도 함께 밀리지 않는다.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: 서버 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/users/register:
    post:
      tags: [users]
      summary: 회원가입 (DID 자동 발급)
      description: |
        이메일로 사용자를 만들고 DID를 발급한다.
        - 서버에 `HOLDER_KEY_ENCRYPTION_KEY`가 설정되어 있으면(관리형 지갑) BE가 Ed25519 홀더 키를 만들어 암호화 보관하고,
          그 공개키로 진짜 `did:key:z6Mk...`를 발급한다.
        - 설정이 없으면(`APP_ENV=development`에서만) 홀더 키 없이 임시 DID(`did:key:z6MkMock...`)를 발급한다.
          `APP_ENV=production`에서는 이 값이 없으면 서버가 시작하지 않는다.
        비밀번호는 bcrypt 해시로 저장한다. 8자 미만 또는 72바이트 초과면 422 (1,024자를 넘으면 바이트를 세기 전에 길이 검사로 422).
        이름(1~100자)·이메일(3~255자, `@` 포함)은 앞뒤 공백·줄바꿈을 잘라 낸 한 줄 텍스트다. 안쪽에 줄바꿈·탭 같은 제어 문자,
        U+2028·U+2029, 방향 제어·보이지 않는 서식 문자(U+202E·U+200B·U+FEFF 등)가 있으면 422
        `Value error, must be a single line without control characters`, NUL이 있으면 422. 이름의 이모지·NBSP는 받는다.
        이메일은 `@`가 하나이고 앞뒤에 보이는 글자가 있어야 하며, 공백(NBSP 포함)·`"(),:;<>[\]`·이름에는 받는 폭 0 글자(이형 선택자
        U+FE00–U+FE0F·U+E0100–U+E01EF, CGJ, 몽골 자유 이형 선택자, U+FFFC)가 있으면 422 `Value error, Invalid email`이다
        (서식 문자(Cf)와 그 밖의 보이지 않는 글자는 위 한 줄 검사가 먼저 422로 거절한다) (국제화 이메일의 비ASCII 글자는 받는다. 로그인 요청에는 이 검사가 없다). 이메일은 소문자로 저장하며, 소문자로 바꾸면 길어지는 글자(예: `İ`(U+0130)는 두 글자가 됨) 때문에
        바꾼 값이 255자를 넘으면 422 `Value error, Email must be at most 255 characters`다.
        가입과 동시에 로그인 토큰(`access_token`)을 준다. FE는 응답의 `data`를 그대로 로그인 상태로 저장한다.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                success: true
                message: 회원가입 완료. 발급된 DID를 프론트엔드에서 보관하세요.
                data:
                  id: 3f2b9c1e-6a7d-4e1f-9b2a-1c3d5e7f9a0b
                  name: 홍길동
                  email: hong@test.com
                  did: did:key:z6MkMock1a2b3c4d5e6f
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: bearer
                expires_in: 86400
        "400":
          description: |
            이미 가입된 이메일. FE 가입 화면의 안내가 이 응답에 기대므로, 이 응답으로 가입 여부를 알 수 있다는 점은 의도된 동작이다
            (운영에서는 nginx의 IP별 요청 수 제한으로 대량 확인을 막는다).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Email already registered
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/login:
    post:
      tags: [users]
      summary: 로그인
      description: |
        이메일과 비밀번호를 확인한다. 이메일이 없거나, 비밀번호가 틀리거나,
        비밀번호가 설정되지 않은 사용자(소셜 로그인으로만 가입한 계정 등)는 모두 같은 401을 반환한다.
        응답 시간도 같다: 세 경우 모두(비밀번호가 72바이트를 넘어도) 같은 비용의 bcrypt 비교를 한 번 한다(가입 여부가 시간으로
        드러나지 않음).
        시드 테스트 계정(`user001@example.com` ~ `user045@example.com`)의 비밀번호는 `test1234` (로컬 시드 DB 전용).
        성공하면 `access_token`을 준다. 이메일은 앞뒤 공백·대소문자를 구분하지 않는다.

        같은 이메일로 15분 안에 10번 실패하면, 가장 오래된 실패가 15분을 지날 때까지 그 이메일의 로그인은 비밀번호가 맞아도
        429다(비밀번호를 확인하지 않음). 로그인에 성공하면 다시 센다. 가입하지 않은 이메일도 똑같이 세므로 429로 가입 여부가
        드러나지 않고, 422(형식 오류)는 세지 않는다. DB 오류로 계정을 조회하지 못한 시도(500, 이때도 같은 비용의 bcrypt 비교를
        한 번 한다)는 실패로 센다. 다만 DB가 바빠 503 `Service is busy. Try again later.`(`ServiceBusy`)로 답한 시도는 세지 않는다
        (비밀번호를 확인한 적이 없고 잠시 뒤 다시 하라고 답하므로, 다시 시도해도 잠기지 않는다. bcrypt 비교는 똑같이 한 번 한다).
        BE 프로세스(태스크)마다 메모리에서 따로 세고 재시작하면 지워진다.
        이메일은 DB 조회(`lower(email)`)처럼 앞뒤 공백을 떼고 글자마다 소문자로 접어서 센다(PostgreSQL 기본(libc) 정렬의
        `lower()`와 같게 `İ`(U+0130) → `i`, 어말을 포함한 모든 `Σ` → `σ`). 그래서 DB가 같은 이메일로 보는 표기(예: `kİm@…`와
        `kim@…`. 이런 글자는 API를 직접 부를 때만 쓸 수 있고 FE 입력 검사는 받지 않음)는 같은 기록을 쓴다: 표기를 섞어 실패해도
        함께 세고, 잠기면 가입 여부와 관계없이 어느 표기든 429(`Retry-After`)이며, 그 표기로 로그인에 성공하면 기록이 지워진다.
        Compose·CI의 DB 이미지(`pgvector/pgvector:0.8.7-pg16-bookworm`, glibc 2.36)의 `lower()`는 모든 글자를 이 기록의 키와
        똑같이 접는 것을 확인했다.
        예외(DB 정렬이 이와 다르게 접을 때만, 예: ICU 정렬, 또는 BE 파이썬(3.11, 유니코드 14)보다 새 유니코드 대소문자 표를 쓰는
        libc): DB가 다른 기록을 쓰는 표기로 계정을 찾으면 그 표기대로
        따로 세고(로그인에 성공해도 그 표기의 기록은 지우지 않음) 찾은 계정의 이메일로도 센다. 그 계정이 잠겼으면 429 대신 위와
        같은 401이다(비밀번호는 확인하지 않고 `Retry-After`도 없음). 이런 표기로 실패하면 가입된 이메일일 때만 계정 이메일에도
        세므로, 섞어 보내면 429로 가입 여부가 드러날 수 있다(가입 API의 400으로도 알 수 있는 정보).
        이메일·비밀번호가 1,024자를 넘으면 422.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                success: true
                message: 로그인 성공
                data:
                  id: 3f2b9c1e-6a7d-4e1f-9b2a-1c3d5e7f9a0b
                  name: 홍길동
                  email: hong@test.com
                  did: did:key:z6MkMock1a2b3c4d5e6f
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: bearer
                expires_in: 86400
        "401":
          description: 이메일 또는 비밀번호가 올바르지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Invalid email or password
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: 같은 이메일로 너무 많이 실패함. `Retry-After`(초, 최대 900) 뒤에 다시 시도
          headers:
            Retry-After:
              description: 다시 시도할 수 있을 때까지의 초
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Too many attempts. Try again later.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/logout:
    post:
      tags: [users]
      summary: 로그아웃 (이 계정의 토큰을 서버에서 모두 무효로)
      description: |
        이 사용자에게 지금까지 발급한 액세스 토큰을 모두 무효로 만든다 (다른 탭·브라우저·기기 포함).
        이후 그 토큰으로 부르면 401 `Invalid token`이다. 다시 쓰려면 새로 로그인한다. 요청 본문은 받지 않는다.
        사용자 토큰이 필요하다 (토큰 없음·서비스 키·무효 토큰은 401).
        FE는 화면에서 로그아웃할 때 응답을 기다리지 않고 호출한다.
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 로그아웃됨 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me:
    get:
      tags: [users]
      summary: 내 정보 조회 (토큰 확인용)
      description: |
        토큰의 사용자 프로필을 돌려준다. 사용자 토큰이 필요하다(서비스 키는 401).
        FE는 새로고침 후 저장된 토큰이 아직 유효한지 확인할 때 쓸 수 있다.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/UserProfile"
                  wallet:
                    type: object
                    required: [custody, key_type]
                    description: 지갑(홀더 키) 상태
                    properties:
                      custody:
                        type: string
                        enum: [managed, none]
                        description: "`managed`: BE가 홀더 키를 보관 (신원 자격증명 사용 가능). `none`: 키 없는 기존 사용자"
                      key_type:
                        type: [string, "null"]
                        example: Ed25519
                  oauth_providers:
                    type: array
                    items:
                      type: string
                    description: "연동된 소셜 로그인 제공자 목록 (`google`·`github`·`naver`, 이름순. 예: `[\"github\", \"google\"]`).
                      DB에 지금은 로그인 경로가 없는 예전 제공자의 연동 행이 남아 있으면 그 이름도 그대로 들어간다 (FE는 모르는 이름을 무시한다)"
                    example: [github, google]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 토큰을 확인한 직후 사용자가 삭제됨 (이미 삭제된 사용자의 토큰은 401 `Invalid token`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/oauth/google/authorize:
    get:
      tags: [users]
      summary: Google OAuth 인가 URL 발급 (또는 리다이렉트)
      description: |
        Google OAuth 2.0 로그인 시작 URL과 CSRF 방지용 서명된 `state`를 발급한다 (공통 규칙은 info.description "소셜 로그인").
        - `redirect=true`면 JSON 대신 302 Redirect로 Google 로그인 페이지로 보낸다.
        - `redirect_uri`를 생략하면 서버 `GOOGLE_REDIRECT_URI`를 쓰며, 지정 시 허용 목록(`GOOGLE_REDIRECT_URI` +
          `GOOGLE_ALLOWED_REDIRECT_URIS`)에 글자 그대로 있어야 한다.
          `APP_ENV=production`은 `GOOGLE_REDIRECT_URI`를 localhost 기본값으로 대신하지 않고, 허용 목록은 모두 `https://` 주소다.
        - PKCE를 쓸 경우 `code_challenge`와 `code_challenge_method=S256`을 전달할 수 있다. `code_challenge`는 S256 값
          (SHA-256의 base64url, 패딩 없는 43자)이어야 하고, 그 밖의 값은 400 `Invalid code_challenge`다.
        - 인가 주소는 `https://accounts.google.com/o/oauth2/v2/auth`이고 `scope=openid email profile`, `prompt=select_account`를 싣는다.
        - `GOOGLE_CLIENT_ID` 또는 `GOOGLE_CLIENT_SECRET`이 없으면 503 `Google OAuth is not configured`를 반환한다.
      operationId: googleOAuthAuthorize
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthRedirectUri"
        - $ref: "#/components/parameters/OAuthCodeChallenge"
        - $ref: "#/components/parameters/OAuthCodeChallengeMethod"
        - $ref: "#/components/parameters/OAuthRedirect"
      responses:
        "200":
          $ref: "#/components/responses/OAuthAuthorized"
        "302":
          description: "`redirect=true`일 때 Google 로그인 페이지로 리다이렉트"
        "400":
          $ref: "#/components/responses/OAuthAuthorizeBadRequest"
        "503":
