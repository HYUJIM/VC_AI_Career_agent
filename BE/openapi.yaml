openapi: 3.1.0
info:
  title: VC AI Career Agent — BE API
  version: 0.3.0
  description: |
    BE(FastAPI) 파트의 OpenAPI 명세. FE(`FE/src/api/*.ts`, `FE/src/types/api.ts`)가 실제로 호출하는
    계약을 기준으로 작성했다.

    ## 아키텍처: BFF (Backend For Frontend)
    BE는 DXWorks API(발급/검증)를 내부에서 호출하고, 그 결과를 자체 DB(PostgreSQL)에 저장한 뒤
    FE/AI가 바로 쓸 수 있는 형태로 조립해서 응답한다.

    ## 응답/에러 규칙
    - 성공 응답 중 쓰기 계열(`register`, `login`, `verify`, `mock-issuer/issue`)은
      `{ success, message, ... }` 봉투(envelope)를 쓴다. 조회 계열(`careers`)은 봉투 없이 본문을 바로 반환한다.
    - 에러는 FastAPI 기본 형식 `{ "detail": "..." }` 으로 반환한다.
      FE는 `detail → message → error` 순서로 메시지를 읽는다 (`FE/src/lib/apiClient.ts`).
    - 요청 본문 검증 실패는 FastAPI 기본 422 응답(`detail` 배열)이다.

    ## 인증
    이메일 + 비밀번호(bcrypt 해시 저장)로 로그인한다. 로그인 이후의 토큰/세션은 아직 없다.
    FE는 로그인 응답의 사용자 정보(`did` 포함)를 localStorage에 보관하고 이후 요청 경로에 DID를 넣어 호출한다.
  contact:
    name: BE 파트

servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버 (docker compose). FE 개발 서버는 `/api` 프록시로 이 주소에 연결한다.

# 현재 인증 없음 (info.description의 "인증" 참고)
security: []

tags:
  - name: health
    description: 서버 상태 확인
  - name: users
    description: 회원가입 / 로그인
  - name: careers
    description: AI/FE용 사용자 프로필 + 자격증명 조회
  - name: verify
    description: 자격증명 검증 후 저장
  - name: mock-issuer
    description: 테스트용 모의 배지 발급

paths:
  /health:
    get:
      tags: [health]
      summary: 서버 상태 확인
      operationId: getHealth
      responses:
        "200":
          description: 서버 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/users/register:
    post:
      tags: [users]
      summary: 회원가입 (DID 자동 발급)
      description: |
        이메일로 사용자를 만들고 임시 DID(`did:key:z6MkMock...`)를 발급한다.
        비밀번호는 bcrypt 해시로 저장한다. 8자 미만 또는 72바이트 초과면 422.
        FE는 응답의 `data`를 그대로 로그인 상태로 저장한다.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                success: true
                message: 회원가입 완료. 발급된 DID를 프론트엔드에서 보관하세요.
                data:
                  id: 3f2b9c1e-6a7d-4e1f-9b2a-1c3d5e7f9a0b
                  name: 홍길동
                  email: hong@test.com
                  did: did:key:z6MkMock1a2b3c4d5e6f
        "400":
          description: 이미 가입된 이메일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Email already registered
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/login:
    post:
      tags: [users]
      summary: 로그인
      description: |
        이메일과 비밀번호를 확인한다. 이메일이 없거나, 비밀번호가 틀리거나,
        비밀번호가 설정되지 않은 사용자(신원 VP 검증으로 생성된 사용자 등)는 모두 같은 401을 반환한다.
        시드 테스트 계정(`user001@example.com` ~ `user045@example.com`)의 비밀번호는 `test1234`.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                success: true
                message: 로그인 성공
                data:
                  id: 3f2b9c1e-6a7d-4e1f-9b2a-1c3d5e7f9a0b
                  name: 홍길동
                  email: hong@test.com
                  did: did:key:z6MkMock1a2b3c4d5e6f
        "401":
          description: 이메일 또는 비밀번호가 올바르지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Invalid email or password
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/subjects/{did}/careers:
    get:
      tags: [careers]
      summary: 사용자 프로필과 자격증명 목록 조회
      description: |
        DID로 사용자를 찾고, 그 사용자의 자격증명을 `issued_at` 최신순으로 반환한다.
        FE 대시보드와 AI 포트폴리오 빌더가 사용한다.

        현재는 `status`와 관계없이 모든 자격증명을 반환한다. 화면/AI 쪽에서 `status`로 걸러 써야 한다.
      operationId: getCareersByDid
      parameters:
        - $ref: "#/components/parameters/Did"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareersResponse"
              example:
                user_profile:
                  id: 3f2b9c1e-6a7d-4e1f-9b2a-1c3d5e7f9a0b
                  did: did:key:z6MkMock1a2b3c4d5e6f
                  email: hong@test.com
                  name: 홍길동
                verified_credentials:
                  - record_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    issuer: 한국산업인력공단 (HRDK)
                    achievement_name: 정보처리기사
                    status: verified
                    issued_at: "2026-09-01T00:00:00+00:00"
                    raw_data: {}
        "404":
          description: 해당 DID의 사용자가 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: User not found or not verified yet.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/verify:
    post:
      tags: [verify]
      summary: 자격증명 검증 후 DB 저장
      description: |
        `type`에 따라 DXWorks 검증 API를 호출하고, 검증에 성공하면 DB에 저장한다.

        - `identity`: VP 토큰을 검증하고 사용자 정보를 저장/갱신한다 (`subject_did` 기준 upsert).
        - `badge`: OB3 VC-JWT를 검증하고 자격증명을 저장/갱신한다
          (`user_id + source_provider + source_external_id` 기준 upsert).
          수신자 DID의 사용자가 없으면 테스트용 임시 사용자를 자동으로 만든다.

        검증 자체가 실패해도 HTTP 200에 `success: false`로 응답한다.
        DXWorks 호출 오류 등 예외는 500이다.
      operationId: verifyCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
            examples:
              badge:
                summary: 배지 검증 (mock-issuer/issue로 받은 vcJwt)
                value:
                  type: badge
                  token: eyJhbGciOiJFZERTQSJ9...
              identity:
                summary: 신원 VP 검증
                value:
                  type: identity
                  token: eyJhbGciOiJFZERTQSJ9...
      responses:
        "200":
          description: |
            요청 처리 완료. 검증 성공 여부는 `success`로 판단한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
              examples:
                badgeVerified:
                  summary: 배지 검증 성공
                  value:
                    success: true
                    message: Badge verified and saved.
                    data:
                      valid: true
                      badge:
                        name: 정보처리기사
                        issuedAt: "2026-09-01T00:00:00Z"
                      checks:
                        issuer: { issuerName: 한국산업인력공단 }
                        issuerTrust: { trusted: true }
                        credentialId: { id: "urn:uuid:7c9e6679-7425-40de-944b-e07fc1f90ae7", credentialStatus: VALID }
                        recipient: { subjectId: "did:key:z6MkMock1a2b3c4d5e6f" }
                badgeFailed:
                  summary: 배지 검증 실패
                  value:
                    success: false
                    message: Badge verification failed.
                    data:
                      valid: false
                identityVerified:
                  summary: 신원 검증 성공
                  value:
                    success: true
                    message: Identity verified and saved.
                    data:
                      verified: true
                      holderDid: did:key:z6MkMock1a2b3c4d5e6f
                      claims: { name: 홍길동, email: hong@test.com }
        "400":
          description: 지원하지 않는 `type`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: 'Invalid type. Use "identity" or "badge"'
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mock-issuer/issue:
    post:
      tags: [mock-issuer]
      summary: 모의 배지 발급 (테스트용)
      description: |
        DXWorks OB3 발급 API로 배지를 발급하고 서명된 VC-JWT를 돌려준다.
        FE 발급 화면은 이 `vcJwt`를 그대로 `POST /api/v1/verify` (`type: badge`)에 넘긴다.
        `.env`의 `DXWORKS_API_KEY`가 필요하다.
      operationId: issueMockBadge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueMockBadgeRequest"
      responses:
        "200":
          description: 발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMockBadgeResponse"
              example:
                success: true
                message: Successfully issued a mock badge
                vcJwt: eyJhbGciOiJFZERTQSJ9...
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    Did:
      name: did
      in: path
      required: true
      description: 조회 대상 사용자의 DID (`users.subject_did`). 경로에 넣을 때 URL 인코딩한다.
      schema:
        type: string
      example: did:key:z6MkMock1a2b3c4d5e6f

  responses:
    ValidationError:
      description: 요청 본문 검증 실패 (FastAPI 기본 형식)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    InternalError:
      description: 서버 내부 오류 (DB/DXWorks 호출 실패 등). `detail`에 원인 메시지가 들어간다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── 공통 ──────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: 사람이 읽을 수 있는 에러 메시지

    ValidationErrorResponse:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf: [{ type: string }, { type: integer }]
              msg:
                type: string
              type:
                type: string

    HealthResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: ok
        message:
          type: string
          example: VC AI Career Agent BE (FastAPI) is running

    # ── 사용자 ────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, did, email, name]
      properties:
        id:
          type: string
          format: uuid
        did:
          type: string
          description: 사용자 DID (`users.subject_did`)
        email:
          type: string
          format: email
        name:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: 8자 이상, UTF-8 기준 72바이트 이하 (bcrypt 제한). bcrypt 해시로 저장된다.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      description: 회원가입/로그인 공통 응답 (FE `RegisterResponse`, `LoginResponse`)
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/UserProfile"

    # ── 자격증명 ──────────────────────────────────────────────
    CredentialStatus:
      type: string
      description: DB `verification_status` ENUM과 같은 값 집합
      enum: [verified, invalid, revoked, expired, unverifiable, pending]

    VerifiedCredential:
      type: object
      required: [record_id, issuer, achievement_name, status, issued_at, raw_data]
      properties:
        record_id:
          type: string
          format: uuid
        issuer:
          type: string
          description: 발급 기관명 (`credentials.issuer_name`)
        achievement_name:
          type: string
          description: 배지/자격명
        status:
          $ref: "#/components/schemas/CredentialStatus"
        issued_at:
          type: string
          format: date-time
        raw_data:
          type: object
          additionalProperties: true
          description: 원본 VC JSON 전문

    CareersResponse:
      type: object
      required: [user_profile, verified_credentials]
      properties:
        user_profile:
          $ref: "#/components/schemas/UserProfile"
        verified_credentials:
          type: array
          description: |
            이름과 달리 현재는 검증 상태와 관계없이 모든 자격증명이 들어 있다. `status`로 구분한다.
          items:
            $ref: "#/components/schemas/VerifiedCredential"

    # ── 검증 ──────────────────────────────────────────────────
    VerifyRequest:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          enum: [identity, badge]
        token:
          type: string
          description: "`identity`면 VP 토큰, `badge`면 OB3 VC-JWT"

    VerifyResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          description: 검증 성공 + DB 저장 완료 여부
        message:
          type: string
        data:
          type: object
          additionalProperties: true
          description: |
            DXWorks 검증 API 응답 원문. 형식은 DXWorks가 정하며 BE가 쓰는 필드는 다음과 같다.
            - `identity`: `verified`, `holderDid`, `claims.name`, `claims.email`
            - `badge`: `valid`, `badge.name`, `badge.issuedAt`, `checks.issuer.issuerName`,
              `checks.issuerTrust.trusted`, `checks.credentialId.id`, `checks.credentialId.credentialStatus`,
              `checks.recipient.subjectId`

    # ── 모의 발급 ─────────────────────────────────────────────
    IssueMockBadgeRequest:
      type: object
      required: [templateId, holderDid]
      properties:
        templateId:
          type: string
          description: DXWorks 배지 템플릿 ID
        holderDid:
          type: string
          description: 배지를 받을 사용자 DID

    IssueMockBadgeResponse:
      type: object
      required: [success, message, vcJwt]
      properties:
        success:
          type: boolean
        message:
          type: string
        vcJwt:
          type: string
          description: DXWorks가 서명한 OB3 VC-JWT
