openapi: 3.1.0
info:
  title: VC AI Career Agent — BE API
  version: 0.7.0
  description: |
    BE(FastAPI) 파트의 OpenAPI 명세. FE(`FE/src/api/*.ts`, `FE/src/types/api.ts`)가 실제로 호출하는
    계약을 기준으로 작성했다.

    ## 아키텍처: BFF (Backend For Frontend)
    BE는 DXWorks API(발급/검증)를 내부에서 호출하고, 그 결과를 자체 DB(PostgreSQL)에 저장한 뒤
    FE가 바로 쓸 수 있는 형태로 조립해서 응답한다.

    ## 응답/에러 규칙
    - 성공 응답 중 쓰기 계열(`register`, `login`, `verify`, `mock-issuer/issue`)은
      `{ success, message, ... }` 봉투(envelope)를 쓴다. 조회 계열(`careers`)은 봉투 없이 본문을 바로 반환한다.
    - 에러는 FastAPI 기본 형식 `{ "detail": "..." }` 으로 반환한다.
      FE는 `detail → message → error` 순서로 메시지를 읽는다 (`FE/src/lib/apiClient.ts`).
    - AI 서비스 연동 오류(직무 비교·커리큘럼 API)와 발급·검증 인프라(DXWorks) 오류에만 기계용 사유 코드 `code`가 더 붙는다:
      `{ "detail": "...", "code": "..." }`. AI 연동 오류의 상태 코드와 `detail`은 그대로다.
    - 요청 본문 검증 실패는 FastAPI 기본 422 응답(`detail` 배열)이다. DB에 저장할 수 없는 문자열이 가입 이름·이메일,
      로그인 이메일, 검증 `token`, 모의 발급 필드, 공유 `label`, 포트폴리오 제목·희망 직무에 있으면 422이고 `loc`은 그 필드다.
      NUL(`\u0000`)은 `Value error, must not contain NUL or unpaired surrogate characters`(`type: value_error`),
      짝 없는 서로게이트(예: JSON `\ud800`)는 FastAPI(pydantic) 기본 메시지
      `Input should be a valid string, unable to parse raw data as a unicode string`(`type: string_unicode`)이다.
      DID 경로의 NUL(`%00`)은 첫 메시지의 422(`loc: ["path", "did"]`)이고, 그 밖의 입력이 DB 단계에서 같은 이유로 걸려도
      첫 메시지의 422(`loc: []`)다. 한 줄 필드(가입 이름·이메일, 포트폴리오 제목·희망 직무)의 앞뒤 공백을 자른 값 안에
      줄바꿈·탭 같은 제어 문자나 U+2028·U+2029가 있으면 `Value error, must be a single line without control characters`로 422다.
    - 요청 본문 상한은 2 MiB(2,097,152바이트)다. `Content-Length`가 이보다 크면 경로·인증과 관계없이 본문을 읽지 않고
      413 텍스트 `Content Too Large`로 답한다(본문을 받지 않는 API는 처리한 뒤 응답만 413으로 바뀐다). `Content-Length` 없는
      chunked 전송은 읽은 양이 2 MiB를 넘는 순간 413 `{ "detail": "Content Too Large" }`로 끊고(본문을 받지 않는 API는 본문을
      읽지 않으므로 413 없이 그대로 처리한다), 어느 쪽이든 요청 하나가 읽는 본문은 2 MiB 남짓까지다.
    - DXWorks 호출 실패는 502 `{ "detail": "Credential service error", "code": "PROVIDER_ERROR" }`, 설정 누락·사용 불가
      (`DXWORKS_API_HOST`가 없거나 `https://` 주소가 아님, API 키·기본 템플릿 ID 없음)는 503
      `{ "detail": "Credential service is not configured", "code": "PROVIDER_NOT_CONFIGURED" }`이다.
      협력사 오류 코드·메시지와 빠진 설정 이름은 응답에 싣지 않고 BE 로그(`Provider error: ...`)에만 남긴다.
      그 외 내부 오류는 500 `Internal server error` (내부 예외 메시지는 응답에 싣지 않는다).
    - 직무 비교·포트폴리오 생성 중 재검증에서 검증기 장애(설정 누락·연결 실패·시간 초과·5xx·408·429)가 나면
      결과를 저장하지 않고 502/503으로 답한다. 특정 자격증명에 대한 거절(그 밖의 4xx)은 그 자격증명만 제외한다.
    - 모든 응답에 `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`,
      `X-Frame-Options: DENY`, `Content-Security-Policy: frame-ancestors 'none'`이 붙고, 서버가 `APP_ENV=production`이면
      `Strict-Transport-Security: max-age=31536000`도 붙는다 (CORS 사전 요청(OPTIONS) 응답은 제외).

    ## 인증
    이메일 + 비밀번호(bcrypt)로 로그인하면 JWT 액세스 토큰(`access_token`)을 준다.
    이후 요청은 `Authorization: Bearer <access_token>` 헤더를 붙인다.

    요청 주체는 두 가지다.
    - **사용자 토큰**: 본인 DID의 데이터만 읽고 쓸 수 있다. 남의 DID면 403.
    - **서비스 키** (`X-Service-Key`): 선택 사항인 내부 서비스용 키(현재 쓰는 곳 없음). 모든 DID의 `careers`·`evidence` 읽기만 가능하고,
      `POST /api/v1/verify`는 403, 그 밖의 API는 401이다.

    토큰도 서비스 키도 없으면 서버 설정과 관계없이 401 `Authentication required` + `WWW-Authenticate: Bearer`다
    (`Bearer`가 아닌 `Authorization`, 예: Basic도 토큰 없음으로 본다). 토큰 없이 부를 수 있는 API는 `security: []`로 표시한 것
    (회원가입·로그인·`/health`·공유 링크 조회)과 API 문서(`/docs`, `/redoc`, `/openapi.json`)뿐이다.

    사용자 토큰은 서명·만료와 함께 `ver` 클레임이 계정의 현재 토큰 버전(`users.token_version`)과 같아야 받는다.
    로그아웃(`POST /api/v1/users/logout`)하면 버전이 올라가 그 계정에 발급한 토큰이 모두(다른 탭·브라우저·기기 포함)
    401 `Invalid token`이 된다. 계정이 없어진 토큰도 401 `Invalid token`, 만료된 토큰은 401 `Token expired`다.
    `ver`가 없는 예전 토큰은 0으로 본다. 토큰 수명은 서버 `JWT_EXPIRES_MINUTES`(1~1440분, 기본 1440)다.
    같은 이메일로 15분 안에 10번 로그인에 실패하면 그 이메일의 로그인은 429(`Retry-After`)다 (`POST /api/v1/users/login` 참고).

    ## 실행 시점 재검증 준비 (v0.4.0)
    배지 검증 시(검증기가 발급자 서명·신뢰를 확인한 배지만 저장) 서명된 원본 VC-JWT를 `credentials.raw_token`에,
    점검 항목 8개를 `verification_checks`에 저장한다.
    (논문 RAG-VC: DB 사본이 아닌 서명 원본을 다시 검증하기 위한 전제)
  contact:
    name: BE 파트

servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버 (docker compose). FE 개발 서버는 `/api` 프록시로 이 주소에 연결한다.

# 기본은 사용자 토큰 (info.description "인증" 참고). 토큰 없이 부를 수 있는 API는 operation에 security: []로 표시한다.
security:
  - bearerAuth: []

tags:
  - name: health
    description: 서버 상태 확인
  - name: users
    description: 회원가입 / 로그인 / 로그아웃
  - name: careers
    description: AI/FE용 사용자 프로필 + 자격증명 조회
  - name: verify
    description: 자격증명 검증 후 저장
  - name: mock-issuer
    description: 테스트용 모의 배지 발급
  - name: reverify
    description: 실행 시점 재검증 (저장된 서명 원본을 요청 시점에 다시 검증)
  - name: portfolios
    description: 검증된 자격증명만으로 만드는 포트폴리오 (VC_ONLY)
  - name: shares
    description: 선택 공개 링크와 기업용 조회
  - name: career
    description: 직무 비교·커리큘럼 (계산은 AI 서비스 `ai/`, 증거·저장·권한은 BE)

paths:
  /health:
    get:
      tags: [health]
      summary: 서버 상태 확인
      operationId: getHealth
      security: []
      responses:
        "200":
          description: 서버 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/users/register:
    post:
      tags: [users]
      summary: 회원가입 (DID 자동 발급)
      description: |
        이메일로 사용자를 만들고 DID를 발급한다.
        - 서버에 `HOLDER_KEY_ENCRYPTION_KEY`가 설정되어 있으면(관리형 지갑) BE가 Ed25519 홀더 키를 만들어 암호화 보관하고,
          그 공개키로 진짜 `did:key:z6Mk...`를 발급한다.
        - 설정이 없으면(`APP_ENV=development`에서만) 홀더 키 없이 임시 DID(`did:key:z6MkMock...`)를 발급한다.
          `APP_ENV=production`에서는 이 값이 없으면 서버가 시작하지 않는다.
        비밀번호는 bcrypt 해시로 저장한다. 8자 미만 또는 72바이트 초과면 422 (1,024자를 넘으면 바이트를 세기 전에 길이 검사로 422).
        이름(1~100자)·이메일(3~255자, `@` 포함)은 앞뒤 공백·줄바꿈을 잘라 낸 한 줄 텍스트다. 안쪽에 줄바꿈·탭 같은 제어 문자나
        U+2028·U+2029가 있으면 422 `Value error, must be a single line without control characters`, NUL이 있으면 422.
        이모지·NBSP는 받는다. 이메일은 소문자로 저장하며, 소문자로 바꾸면 길어지는 글자(예: `İ`(U+0130)는 두 글자가 됨) 때문에
        바꾼 값이 255자를 넘으면 422 `Value error, Email must be at most 255 characters`다.
        가입과 동시에 로그인 토큰(`access_token`)을 준다. FE는 응답의 `data`를 그대로 로그인 상태로 저장한다.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                success: true
                message: 회원가입 완료. 발급된 DID를 프론트엔드에서 보관하세요.
                data:
                  id: 3f2b9c1e-6a7d-4e1f-9b2a-1c3d5e7f9a0b
                  name: 홍길동
                  email: hong@test.com
                  did: did:key:z6MkMock1a2b3c4d5e6f
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: bearer
                expires_in: 86400
        "400":
          description: |
            이미 가입된 이메일. FE 가입 화면의 안내가 이 응답에 기대므로, 이 응답으로 가입 여부를 알 수 있다는 점은 의도된 동작이다
            (운영에서는 WAF의 IP별 요청 수 제한으로 대량 확인을 막는다).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Email already registered
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/login:
    post:
      tags: [users]
      summary: 로그인
      description: |
        이메일과 비밀번호를 확인한다. 이메일이 없거나, 비밀번호가 틀리거나,
        비밀번호가 설정되지 않은 사용자(신원 VP 검증으로 생성된 사용자 등)는 모두 같은 401을 반환한다.
        응답 시간도 같다: 세 경우 모두(비밀번호가 72바이트를 넘어도) 같은 비용의 bcrypt 비교를 한 번 한다(가입 여부가 시간으로
        드러나지 않음).
        시드 테스트 계정(`user001@example.com` ~ `user045@example.com`)의 비밀번호는 `test1234` (로컬 시드 DB 전용).
        성공하면 `access_token`을 준다. 이메일은 앞뒤 공백·대소문자를 구분하지 않는다.

        같은 이메일로 15분 안에 10번 실패하면, 가장 오래된 실패가 15분을 지날 때까지 그 이메일의 로그인은 비밀번호가 맞아도
        429다(비밀번호를 확인하지 않음). 로그인에 성공하면 다시 센다. 가입하지 않은 이메일도 똑같이 세므로 429로 가입 여부가
        드러나지 않고, 422(형식 오류)는 세지 않는다. DB 오류로 계정을 조회하지 못한 시도(500, 이때도 같은 비용의 bcrypt 비교를
        한 번 한다)는 실패로 센다. BE 프로세스(태스크)마다 메모리에서 따로 세고 재시작하면 지워진다.
        이메일은 DB 조회(`lower(email)`)처럼 앞뒤 공백을 떼고 글자마다 소문자로 접어서 센다(PostgreSQL 기본(libc) 정렬의
        `lower()`와 같게 `İ`(U+0130) → `i`, 어말을 포함한 모든 `Σ` → `σ`). 그래서 DB가 같은 이메일로 보는 표기(예: `kİm@…`와
        `kim@…`. 이런 글자는 API를 직접 부를 때만 쓸 수 있고 FE 입력 검사는 받지 않음)는 같은 기록을 쓴다: 표기를 섞어 실패해도
        함께 세고, 잠기면 가입 여부와 관계없이 어느 표기든 429(`Retry-After`)이며, 그 표기로 로그인에 성공하면 기록이 지워진다.
        Compose·CI의 DB 이미지(`pgvector/pgvector:0.8.7-pg16-bookworm`, glibc 2.36)의 `lower()`는 모든 글자를 이 기록의 키와
        똑같이 접는 것을 확인했다.
        예외(DB 정렬이 이와 다르게 접을 때만, 예: ICU 정렬, 또는 BE 파이썬(3.11, 유니코드 14)보다 새 유니코드 대소문자 표를 쓰는
        libc): DB가 다른 기록을 쓰는 표기로 계정을 찾으면 그 표기대로
        따로 세고(로그인에 성공해도 그 표기의 기록은 지우지 않음) 찾은 계정의 이메일로도 센다. 그 계정이 잠겼으면 429 대신 위와
        같은 401이다(비밀번호는 확인하지 않고 `Retry-After`도 없음). 이런 표기로 실패하면 가입된 이메일일 때만 계정 이메일에도
        세므로, 섞어 보내면 429로 가입 여부가 드러날 수 있다(가입 API의 400으로도 알 수 있는 정보).
        이메일·비밀번호가 1,024자를 넘으면 422.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                success: true
                message: 로그인 성공
                data:
                  id: 3f2b9c1e-6a7d-4e1f-9b2a-1c3d5e7f9a0b
                  name: 홍길동
                  email: hong@test.com
                  did: did:key:z6MkMock1a2b3c4d5e6f
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: bearer
                expires_in: 86400
        "401":
          description: 이메일 또는 비밀번호가 올바르지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Invalid email or password
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: 같은 이메일로 너무 많이 실패함. `Retry-After`(초, 최대 900) 뒤에 다시 시도
          headers:
            Retry-After:
              description: 다시 시도할 수 있을 때까지의 초
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Too many attempts. Try again later.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/logout:
    post:
      tags: [users]
      summary: 로그아웃 (이 계정의 토큰을 서버에서 모두 무효로)
      description: |
        이 사용자에게 지금까지 발급한 액세스 토큰을 모두 무효로 만든다 (다른 탭·브라우저·기기 포함).
        이후 그 토큰으로 부르면 401 `Invalid token`이다. 다시 쓰려면 새로 로그인한다. 요청 본문은 받지 않는다.
        사용자 토큰이 필요하다 (토큰 없음·서비스 키·무효 토큰은 401).
        FE는 화면에서 로그아웃할 때 응답을 기다리지 않고 호출한다.
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 로그아웃됨 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me:
    get:
      tags: [users]
      summary: 내 정보 조회 (토큰 확인용)
      description: |
        토큰의 사용자 프로필을 돌려준다. 사용자 토큰이 필요하다(서비스 키는 401).
        FE는 새로고침 후 저장된 토큰이 아직 유효한지 확인할 때 쓸 수 있다.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/UserProfile"
                  wallet:
                    type: object
                    required: [custody, key_type]
                    description: 지갑(홀더 키) 상태
                    properties:
                      custody:
                        type: string
                        enum: [managed, none]
                        description: "`managed`: BE가 홀더 키를 보관 (신원 자격증명 사용 가능). `none`: 키 없는 기존 사용자"
                      key_type:
                        type: [string, "null"]
                        example: Ed25519
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 토큰을 확인한 직후 사용자가 삭제됨 (이미 삭제된 사용자의 토큰은 401 `Invalid token`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/subjects/{did}/careers:
    get:
      tags: [careers]
      summary: 사용자 프로필과 자격증명 목록 조회
      description: |
        DID로 사용자를 찾고, 그 사용자의 자격증명을 `issued_at` 최신순으로 반환한다.
        FE 대시보드와 AI 포트폴리오 빌더가 사용한다.

        현재는 `status`와 관계없이 모든 자격증명을 반환한다. 화면/AI 쪽에서 `status`로 걸러 써야 한다.

        접근: 사용자 토큰은 본인 DID만(남의 DID면 403), 서비스 키(`X-Service-Key`)는 모든 DID 조회 가능. 둘 다 없으면 401.
        사용자 토큰의 계정은 토큰을 확인할 때 이미 있으므로, 404는 사실상 서비스 키로 없는 DID를 조회할 때만 나온다.
        DID 경로에 NUL(`%00`)이 있으면 422 (`loc: ["path", "did"]`).
        응답 형식은 v0.3.0과 같다.
      operationId: getCareersByDid
      security:
        - bearerAuth: []
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Did"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareersResponse"
              example:
                user_profile:
                  id: 3f2b9c1e-6a7d-4e1f-9b2a-1c3d5e7f9a0b
                  did: did:key:z6MkMock1a2b3c4d5e6f
                  email: hong@test.com
                  name: 홍길동
                verified_credentials:
                  - record_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    issuer: 한국산업인력공단 (HRDK)
                    achievement_name: 정보처리기사
                    status: verified
                    issued_at: "2026-09-01T00:00:00+00:00"
                    raw_data: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 해당 DID의 사용자가 없음 (서비스 키로 조회할 때)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: User not found or not verified yet.
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/verify:
    post:
      tags: [verify]
      summary: 자격증명 검증 후 DB 저장
      description: |
        `type`에 따라 DXWorks 검증 API를 호출한다. 사용자 토큰이 필요하다(토큰 없으면 401, 서비스 키는 403).

        - `identity`: VP 토큰을 검증하고 결과만 돌려준다. **사용자를 만들거나 바꾸지 않는다** (v0.4.0 변경).
          검증기가 알려 준 VP 홀더 DID가 토큰 사용자의 DID와 같아야 한다. 다르거나, 홀더 DID가 없거나(빈 값·문자열이 아닌 값 포함)
          누구의 신원인지 정할 수 없으면 403 `Forbidden: presentation holder is not you`이고 클레임을 돌려주지 않는다.
        - `badge`: OB3 VC-JWT를 검증하고 토큰 사용자의 자격증명으로 저장/갱신한다
          (`user_id + source_provider + source_external_id` 기준 upsert).
          - **검증기가 발급자 서명·신뢰를 확인한 배지만 저장한다**: 검증을 통과한 배지(`verified`)와, 서명(`signature_ok`)과
            발급자 신뢰(`issuer_trusted`)가 모두 확인된 폐기·만료 배지(`revoked`/`expired`, `success: false`,
            메시지 `Badge verification failed. Saved with status '<status>'.`).
          - 그 밖의 토큰(서명·발급자 신뢰를 확인하지 못한 `invalid` 등)과 해석할 수 없거나 수신자를 알 수 없는 토큰
            (NaN·Infinity·범위를 넘는 숫자, NUL·짝 없는 서로게이트, dict·list가 64단계(최상위 객체 = 1단계)보다 깊게 중첩된
            페이로드 포함. 검증기가 확인한 토큰이어도 같음)은 저장하지 않고
            200 `success: false`, 메시지 `Badge verification failed.`, `data.record_id: null`로 답한다. 본문의 자격증명 ID·수신자를
            믿을 수 없으므로 DB를 조회하지 않고(아래 403·409도 나오지 않음), 이미 저장된 같은 자격증명의 레코드도 바꾸지 않는다.
          - 서명된 원본 VC-JWT(`raw_token`)와 점검 항목 8개(`verification_checks`)를 함께 저장한다.
          - 저장할 배지의 수신자(`credentialSubject.id`)가 토큰 사용자 DID와 다르면 403
            `Forbidden: credential was issued to a different DID` (가입하지 않은 DID도 403. 예전의 임시 사용자 자동 생성은 제거).
          - 같은 자격증명이 이미 다른 사용자에게 등록되어 있으면 409.
          - 배지 이름은 255자까지 잘라 저장하고, 255자를 넘거나 저장할 수 없는 문자가 든 자격증명 ID는 같은 ID면 같은 값이 되는
            `sha256:<64 hex>`로 바꿔 저장한다. 날짜는 0001-01-02 ~ 9999-12-30 UTC 안으로 맞춘다.

        검증 실패는 HTTP 200에 `success: false`로 응답한다. `token`은 256 KiB(262,144자)까지이고, 넘거나 NUL이 있으면
        검증기를 부르지 않고 422.
      operationId: verifyCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
            examples:
              badge:
                summary: 배지 검증 (mock-issuer/issue로 받은 vcJwt)
                value:
                  type: badge
                  token: eyJhbGciOiJFZERTQSJ9...
              identity:
                summary: 신원 VP 검증
                value:
                  type: identity
                  token: eyJhbGciOiJFZERTQSJ9...
      responses:
        "200":
          description: |
            요청 처리 완료. 검증 성공 여부는 `success`로 판단한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
              examples:
                badgeVerified:
                  summary: 배지 검증 성공
                  value:
                    success: true
                    message: Badge verified and saved.
                    data:
                      record_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      status: verified
                      valid: true
                      achievement_name: 테스트 수료 배지
                      issuer_name: 예시대학교
                      issuer_trusted: true
                      recipient_did: did:key:z6MkMock1a2b3c4d5e6f
                      issued_at: "2026-09-01T00:00:00+00:00"
                      expires_at: "2026-10-01T00:00:00+00:00"
                      checks:
                        - { name: schema, result: pass, detail: null }
                        - { name: recipient, result: pass, detail: "did:key:z6MkMock1a2b3c4d5e6f" }
                        - { name: signature, result: pass, detail: null }
                        - { name: issuer_trust, result: pass, detail: null }
                        - { name: revocation, result: pass, detail: VALID }
                        - { name: expiration, result: pass, detail: "2026-10-01T00:00:00+00:00" }
                        - { name: did_resolution, result: skip, detail: 검증기 내부에서 처리 }
                        - { name: anchor_match, result: skip, detail: 원장 앵커링 대조 미지원 }
                badgeRevoked:
                  summary: 배지 검증 실패 (발급자 서명·신뢰가 확인된 폐기 배지, 상태와 함께 저장됨)
                  value:
                    success: false
                    message: Badge verification failed. Saved with status 'revoked'.
                    data:
                      record_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      status: revoked
                      valid: false
                      achievement_name: 테스트 수료 배지
                      issuer_name: 예시대학교
                      issuer_trusted: true
                      recipient_did: did:key:z6MkMock1a2b3c4d5e6f
                      issued_at: "2026-09-01T00:00:00+00:00"
                      expires_at: null
                      checks:
                        - { name: revocation, result: fail, detail: REVOKED }
                badgeNotSaved:
                  summary: 배지 검증 실패 (발급자 서명·신뢰를 확인하지 못함, 저장하지 않음)
                  value:
                    success: false
                    message: Badge verification failed.
                    data:
                      record_id: null
                      status: invalid
                      valid: false
                      achievement_name: 테스트 수료 배지
                      issuer_name: 예시대학교
                      issuer_trusted: false
                      recipient_did: did:key:z6MkMock1a2b3c4d5e6f
                      issued_at: "2026-09-01T00:00:00+00:00"
                      expires_at: null
                      checks:
                        - { name: signature, result: fail, detail: null }
                        - { name: issuer_trust, result: fail, detail: null }
                identityVerified:
                  summary: 신원 검증 성공
                  value:
                    success: true
                    message: Identity verified.
                    data:
                      verified: true
                      holder_did: did:key:z6MkMock1a2b3c4d5e6f
                      claims: { name: 홍길동 }
        "400":
          description: 지원하지 않는 `type`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: 'Invalid type. Use "identity" or "badge"'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 발급자가 확인된 배지의 수신자가 본인이 아님, VP 홀더가 본인이 아님, 또는 서비스 키로 호출함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                otherRecipient:
                  value: { detail: "Forbidden: credential was issued to a different DID" }
                otherHolder:
                  value: { detail: "Forbidden: presentation holder is not you" }
                serviceKey:
                  value: { detail: Service key cannot call write APIs }
        "409":
          description: 같은 자격증명이 이미 다른 사용자에게 등록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Credential already registered to another user
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/mock-issuer/issue:
    post:
      tags: [mock-issuer]
      summary: 모의 배지 발급 (테스트용)
      description: |
        DXWorks OB3 발급 API로 배지를 발급하고 서명된 VC-JWT를 돌려준다.
        FE 발급 화면은 이 `vcJwt`를 그대로 `POST /api/v1/verify` (`type: badge`)에 넘긴다.
        서버 `.env`의 `DXWORKS_API_HOST`(`https://` 주소), `DXWORKS_API_KEY`가 필요하다 (없으면 503 `PROVIDER_NOT_CONFIGURED`).

        회사 API 키로 발급하므로 다음 순서로 검사한다.
        1. 로그인 사용자 토큰이 필요하다 (토큰 없음·서비스 키·무효 토큰은 401).
        2. 서버 설정 `MOCK_ISSUER_ENABLED`가 꺼져 있으면 404 `Mock issuer is disabled`. 비우면 `APP_ENV=development`에서만 켜진다
           (운영 이미지 기본값 `APP_ENV=production`에서는 `true`를 넣어야 켜짐).
        3. `templateId`(앞뒤 공백 제거, 비우면 `DXWORKS_BADGE_TEMPLATE_ID`)가 비어 있으면(기본 템플릿도 없음) 503 `PROVIDER_NOT_CONFIGURED`.
           `DXWORKS_BADGE_TEMPLATE_ID`나 서버 설정 `MOCK_ISSUER_TEMPLATE_IDS`(쉼표 구분)에 없는 값이면 협력사 API를 부르지 않고
           403 `Template not allowed`.
        4. `holderDid`가 토큰 사용자 본인 DID가 아니면 403 `Forbidden: can only issue to your own DID`.
        5. 사용자별로 최근 24시간 동안의 발급이 `MOCK_ISSUER_DAILY_LIMIT`건(기본 10)에 닿았으면 협력사 API를 부르지 않고 429
           `Mock issuance limit reached; try again later` (`Retry-After` 헤더 없음). 발급 전에 자리를 잡아 동시 요청·여러 태스크에서도
           넘지 않고, 협력사 호출이 실패한 발급(502/503)은 세지 않는다(잡아 둔 자리를 지우는 DB 작업까지 실패하면 그 502/503은
           그대로 돌려주되 그 자리는 24시간 한도에 남는다).
        발급에 성공하면 사용자·템플릿 ID·VC-JWT의 SHA-256만 기록한다(VC-JWT 원문은 저장하지 않음). 협력사가 발급한 뒤 해시 기록이
        DB 오류로 실패해도 배지는 돌려주고(200), 그 발급 기록은 해시 없이(`token_sha256` NULL) 한도에 남는다. 두 경우 모두 BE 로그에
        발급 기록 ID와 그 DB 작업이 낸 예외의 클래스 이름(예: `OperationalError`)만 든 경고가 한 줄 남는다(토큰·DID·예외 메시지는
        남기지 않는다).
      operationId: issueMockBadge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueMockBadgeRequest"
      responses:
        "200":
          description: 발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMockBadgeResponse"
              example:
                success: true
                message: Successfully issued a mock badge
                vcJwt: eyJhbGciOiJFZERTQSJ9...
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 허용되지 않은 템플릿, 또는 본인 DID가 아닌 `holderDid`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                templateNotAllowed:
                  value: { detail: Template not allowed }
                notYourDid:
                  value: { detail: "Forbidden: can only issue to your own DID" }
        "404":
          description: 모의 발급 비활성화, 또는 토큰을 확인한 직후 계정이 삭제되어 `holderDid`로 가입한 사용자가 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                disabled:
                  value: { detail: Mock issuer is disabled }
                notRegistered:
                  value: { detail: Holder DID is not registered }
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: 사용자별 24시간 모의 발급 한도(`MOCK_ISSUER_DAILY_LIMIT`, 기본 10) 초과. 협력사 API는 호출하지 않는다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Mock issuance limit reached; try again later
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/v1/credentials/{record_id}/reverify:
    post:
      tags: [reverify]
      summary: 자격증명 하나를 지금 다시 검증
      description: |
        저장된 **서명 원본(VC-JWT)**을 검증기에 다시 보내 상태를 갱신한다 (폐기·만료 반영).
        서명 원본이 없는 자격증명(시드 데이터 등)은 `status: unverifiable`로 응답하고 DB는 바꾸지 않는다.
        본인 자격증명만 가능하며 로그인 토큰이 필요하다.
      operationId: reverifyCredential
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: 재검증 완료. 통과 여부는 `success`(= `data.status == verified`)
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Evidence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/v1/subjects/{did}/evidence:
    get:
      tags: [reverify]
      summary: 근거 조회 (요청 시점 재검증)
      description: |
        논문 RAG-VC의 "실행 시점 재검증". DB에 저장된 상태값을 믿지 않고, 요청할 때마다 서명 원본을 다시 검증한 뒤
        **서명 원본 안의 본문**에서 근거를 뽑아 돌려준다.

        - `mode=strict`(기본, 논문 System VC): 지금 검증을 통과한 것만 `evidence`에 넣고 나머지는 `excluded`에 사유와 함께 둔다.
        - `mode=labeled`(논문 System VC-F): 모두 `evidence`에 넣되 `status`/`verified`로 표시한다.
        - `record_id`를 여러 번 주면 그 자격증명만 대상으로 한다 (사전 고정 후보).

        접근: 사용자 토큰은 본인 DID만(남의 DID면 403), 서비스 키(`X-Service-Key`)는 모든 DID. 둘 다 없으면 401.
        DID 경로에 NUL(`%00`)이 있으면 422 (`loc: ["path", "did"]`).
      operationId: getEvidence
      security:
        - bearerAuth: []
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Did"
        - name: mode
          in: query
          schema: { type: string, enum: [strict, labeled], default: strict }
        - name: record_id
          in: query
          description: 대상 자격증명 ID (여러 번 지정 가능). 생략하면 사용자의 전체 자격증명
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: true
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/portfolios:
    get:
      tags: [portfolios]
      summary: 내 포트폴리오 목록
      operationId: listPortfolios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 목록 (최근 수정순)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortfolioSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [portfolios]
      summary: 포트폴리오 생성 (VC_ONLY)
      description: |
        **자유 텍스트 본문을 받지 않는다** (허위 이력 차단, 계획서 "Security by Default").
        요청은 자격증명 ID 목록과 `source: VC_ONLY`만 받고, 정의되지 않은 필드가 있으면 422로 거절한다.

        서버는 고른 자격증명을 **지금 다시 검증**해서 통과한 것만 본문에 넣는다. 통과하지 못한 것은 `excluded`에 사유와 함께 둔다.
        통과한 것이 하나도 없으면 422. 재검증 중 검증기 장애가 나면 저장하지 않고 502/503.
        본문은 현재 템플릿으로 만든다 (`generator: template`). 이후 AI 생성으로 바뀌어도 요청 형식은 같다.
        제목·희망 직무는 본문 머리말에 한 줄로 들어가므로, 앞뒤 공백·줄바꿈을 자른 값 안에 줄바꿈·탭 같은 제어 문자나
        U+2028·U+2029가 있으면 422 `Value error, must be a single line without control characters`다 (NUL도 422).
      operationId: createPortfolio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioCreateRequest"
            example:
              title: 백엔드 개발자 지원용
              target_role: 백엔드 개발자
              record_ids: [7c9e6679-7425-40de-944b-e07fc1f90ae7]
              source: VC_ONLY
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`record_ids` 중 없거나 본인 것이 아닌 자격증명이 있음 (다시 검증하지 않고 아무것도 만들지 않음)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Credential not found
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          description: |
            요청 형식 오류(자유 텍스트 필드 포함, source가 VC_ONLY가 아님, 제목·희망 직무가 한 줄이 아님 등) 또는
            검증을 통과한 자격증명이 없음
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                detail: No verified credentials selected
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/v1/portfolios/{portfolio_id}:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [portfolios]
