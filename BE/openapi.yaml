  /api/v1/career-analyses:
    post:
      tags: [career]
      summary: 직무 비교 (실행 시점 재검증 → AI 비교)
      description: |
        사용자의 **모든 자격증명을 지금 다시 검증**하고 통과한 것만 근거로 AI가 공고 요구사항과 비교한다.
        요구사항별 상태: `supported` / `partially_supported` / `not_evidenced`(근거 없음 ≠ 역량 없음) / `unknown`(판단 보류).
        결과는 5분(`valid_until`) 동안 커리큘럼 생성에 쓸 수 있다. AI 응답이 BE가 보낸 근거 밖을 인용하면 502.
        어차피 실패할 요청은 검증기를 부르기 전에 끝난다(검증기 호출 0번): AI 서비스 설정이 없으면 503(AI_SERVICE_NOT_CONFIGURED),
        `target_posting_id`의 공고가 없으면 404 `Job posting not found`. 서명 원본이 있는 자격증명
        수만큼 검증기 호출 몫을 쓰고, 모자라면 검증기도 AI도 부르지 않고 429 + `Retry-After`.
        AI 묶음 요청 자리는 재검증을 마친 뒤에 잡아 AI의 비교 호출이 끝날 때까지 쥔다 (자리를 쥔 채 검증기를 기다리지 않는다).
        자리를 얻지 못하면 503(AI_SERVICE_BUSY)이고, 그때는 이 요청의 검증기 호출을 이미 쓴 뒤다 (호출자별 몫에 묶인다).
      operationId: createCareerAnalysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_posting_id: { type: string, format: uuid, description: "비우면 전체 공고 기준" }
                region: { type: string }
                seniority: { type: string, enum: [entry, junior, mid, senior, unspecified] }
            example:
              target_posting_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        "201":
          description: "data = CareerAnalysis (comparisons[], skill_evidence[], excluded_record_ids[], warnings[], valid_until)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`target_posting_id`의 공고가 없음 (검증기를 부르지 않는다)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Job posting not found
        "409":
          description: 대상 공고가 마감·오래됨·필터 밖, 또는 비교 중 공고가 바뀜
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          description: 비교에 쓸 공고가 없음 (No eligible reviewed job sources; import sources first)
        "429":
          description: |
            세 가지 한도 가운데 하나에 걸림. 어느 경우든 분석을 저장하지 않고 `Retry-After`(초)가 붙는다.
            - 이 사용자의 24시간 직무 비교 저장 수(200건): 검증기·AI를 부르기 전 (`Daily career analysis limit reached. Try again later.`)
            - 검증기 호출 몫 (`Too many verification requests. Try again later.`, TooManyVerifications 참고): 검증기·AI를 부르기 전
            - 사용자별 AI 묶음 요청 한도 (`Too many analysis requests. Try again later.`, TooManyAnalysisRequests 참고):
              검증기·AI를 부르기 전
          headers:
            Retry-After:
              description: 다시 시도할 수 있을 때까지의 초
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                daily:
                  value: { detail: Daily career analysis limit reached. Try again later. }
                verifier:
                  value: { detail: Too many verification requests. Try again later. }
                corpus:
                  value: { detail: Too many analysis requests. Try again later. }
        "502":
          description: |
            AI 응답이 계약·BE 재검사를 통과하지 못함 (`code` 예: AI_CONTRACT_MISMATCH, AI_RESPONSE_INVALID,
            AI_ANALYSIS_INVARIANT_FAILED), 또는 재검증 중 DXWorks 호출 실패
            (`{ "detail": "Credential service error", "code": "PROVIDER_ERROR" }`, 협력사 메시지는 BE 로그에만).
            어느 경우든 분석을 저장하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: AI service response failed contract checks
                code: AI_ANALYSIS_INVARIANT_FAILED
        "503":
          description: |
            AI 서비스 연결 실패·토큰 불일치·미설정 (`code` 포함, AIUnavailable 참고), 또는 재검증 중 DXWorks 설정 누락·사용 불가
            (`code`: PROVIDER_NOT_CONFIGURED, 빠진 설정 이름은 BE 로그에만). 어느 경우든 분석을 저장하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ai:
                  value: { detail: AI service temporarily unavailable, code: AI_SERVICE_UNAVAILABLE }
                verifier:
                  value: { detail: Credential service is not configured, code: PROVIDER_NOT_CONFIGURED }

  /api/v1/career-analyses/{analysis_id}:
    get:
      tags: [career]
      summary: 내 직무 비교 결과 조회 (과거 시점 결과)
      operationId: getCareerAnalysis
      security:
        - bearerAuth: []
      parameters:
        - { name: analysis_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "data = {analysis, historical_only: true}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/curricula:
    post:
      tags: [career]
      summary: 학습 계획 생성 (동기)
      description: |
        본문은 `CurriculumRequest` (`BE/app/ai_contract/curriculum.py`). 같은 `idempotency_key`로 같은 본문을 보내면 같은 결과, 다른 본문이면 409.
        `mode=llm`은 `CURRICULUM_LLM_USER_IDS`에 있는 계정(`*`면 모든 계정) + `allow_external_processing=true`일 때만 (아니면 403/422).
        분석이 만료되었으면 409. LLM은 허용된 단계·자료·시간만 고르며, 초안이 검사를 통과하지 못하면 템플릿으로 대체한다.
        사용자별 한도: 24시간에 학습 계획 200건, 그중 LLM 모드는 `CURRICULUM_LLM_DAILY_LIMIT`건(기본 20. 외부 LLM까지 간 실패한
        시도도 센다)과 AI 묶음 요청 한도(TooManyAnalysisRequests). 넘으면 429 + `Retry-After`. 같은 `idempotency_key`로 다시
        받는 계획은 한도에 세지 않는다. LLM 모드 계획은 계정마다 한 번에 한 건이다: 겹친 요청은 429
        `An LLM curriculum is already being generated for this account. Try again later.` + `Retry-After: 5`.
        LLM 모드의 외부 처리자는 Anthropic Claude API(AI 서비스가 부름)다. AI가 다시 시도할 수 있다고 답한 생성 실패(`LLM_BUSY`·
        `LLM_PROVIDER_UNAVAILABLE`, Claude 429·5xx의 `LLM_PROVIDER_REJECTED`, 배포 중 설정이 바뀐 `GENERATOR_CONFIGURATION_CHANGED`)는
        503 + `Retry-After: 5`다.
      operationId: createCurriculum
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "CurriculumRequest" }
            example:
              analysis_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              idempotency_key: 9b2f7c1e-1c2d-4e5f-8a9b-0c1d2e3f4a5b
              weeks: 8
              hours_per_week: 6
              budget_krw: 0
              mode: template
              learning_choices: [{ skill_id: spark, action: learn }]
      responses:
        "201":
          description: |
            data = {curriculum_id, request, result: CurriculumResult, created_at}. `result.steps[].resource`는
            `GET /api/v1/learning-resources`와 같은 형태다(`reviewed_by`, `resource.review_note`·`rights_basis`·`raw_text` 제외)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 분석 만료, 자료 변경, 또는 같은 키의 다른 요청
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "429":
          description: |
            사용자별 한도에 걸림 (아무것도 저장하지 않고, LLM 한도면 생성기·LLM을 부르지 않는다). `Retry-After`(초)가 붙는다.
            `Daily curriculum limit reached. Try again later.` (24시간 200건) /
            `Daily LLM curriculum limit reached. Use the template mode or try again later.` (`CURRICULUM_LLM_DAILY_LIMIT`) /
            `Daily LLM curriculum service limit reached. Use the template mode or try again later.` (모든 계정 합계 `CURRICULUM_LLM_GLOBAL_DAILY_LIMIT`, 기본 200) /
            `An LLM curriculum is already being generated for this account. Try again later.` (계정당 동시 LLM 계획 1건,
            `Retry-After: 5`) /
            `Too many analysis requests. Try again later.` (TooManyAnalysisRequests)
          headers:
            Retry-After:
              description: 다시 시도할 수 있을 때까지의 초
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Daily LLM curriculum limit reached. Use the template mode or try again later.
        "503":
          $ref: "#/components/responses/AIUnavailable"

  /api/v1/curricula/{curriculum_id}:
    get:
      tags: [career]
      summary: 내 학습 계획 조회
      operationId: getCurriculum
      security:
        - bearerAuth: []
      parameters:
        - { name: curriculum_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: |
            data = {curriculum_id, request, result, created_at, historical_only: true}. `result.steps[].resource`는
            `GET /api/v1/learning-resources`와 같은 형태다(이 변경 전에 저장한 커리큘럼도 같음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/market/snapshots:
    get:
      tags: [career]
      summary: 직무별 채용 시장 통계 요약
      description: |
        배치(`python -m app.jobs.market`)가 수집한 공고를 AI 서비스가 집계해 저장한 직무별 최신 통계의 요약이다.
        통계가 있는 직무만 나온다. 공고 원문·수집 내부 정보는 응답에 없다. AI 서비스를 부르지 않는다.
      operationId: listMarketSnapshots
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "data = [{role_id, role_label, as_of, sample_size, companies, warnings, top_skills[최대 10개 SkillStatistic]}]"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 저장된 통계가 무결성 검사(내용 해시)에 실패함

  /api/v1/market/snapshots/{role_id}:
    get:
      tags: [career]
      summary: 직무 하나의 최신 채용 시장 통계
      description: |
        `skills`는 중요도(importance) 내림차순이다. 기술마다 언급 공고 수, 자격요건·기술스택·우대사항별 공고 수,
        언급률과 Wilson 95% 구간, 필수 비율이 있다. 중요도는 공고에서 가장 강하게 나온 자리의 가중치
        (자격요건 1.0, 기술스택 0.7, 우대사항 0.5, 업무 언급 0.3)를 회사별 편중을 줄여 평균한 값이다.
        `pairs`는 함께 자주 나오는 기술 쌍(lift), `experience`는 요구 경력 분포다.
        표본이 30건 미만이면 `warnings`에 `SMALL_SAMPLE_STATISTICS_ARE_INDICATIVE_ONLY`가 붙는다.
      operationId: getMarketSnapshot
      security:
        - bearerAuth: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            enum: [bigdata_engineer, privacy_specialist, backend_developer, frontend_developer, infra_engineer]
      responses:
        "200":
          description: "data = MarketSnapshot (app/ai_contract/market.py)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 그 직무의 통계가 아직 없음
        "409":
          description: 저장된 통계가 무결성 검사(내용 해시)에 실패함
        "422":
          description: 없는 직무 ID

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인/회원가입 응답의 `access_token`
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: 선택 사항인 내부 서비스용 키(현재 쓰는 곳 없음). 서버 `SERVICE_API_KEY`와 같아야 한다. 읽기 API만 허용.

  parameters:
    RecordId:
      name: record_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PortfolioId:
      name: portfolio_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Did:
      name: did
      in: path
      required: true
      description: 조회 대상 사용자의 DID (`users.subject_did`). 경로에 넣을 때 URL 인코딩한다.
      schema:
        type: string
      example: did:key:z6MkMock1a2b3c4d5e6f
    OAuthRedirectUri:
      name: redirect_uri
      in: query
      required: false
      description: |
        FE 콜백 주소(브라우저의 FE 출처 + `/auth/<제공자>/callback`). 생략하면 서버의 기본 콜백 주소를 쓴다.
        서버 설정과 글자 그대로 같아야 한다(아니면 400 `Invalid redirect_uri`).
      schema:
        type: string
    OAuthCodeChallenge:
      name: code_challenge
      in: query
      required: false
      description: PKCE S256 값 (SHA-256의 base64url, 패딩 없는 43자). 네이버는 형식만 검사하고 인가 주소에 싣지 않는다.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    OAuthCodeChallengeMethod:
      name: code_challenge_method
      in: query
      required: false
      schema:
        type: string
        enum: [S256]
    OAuthRedirect:
      name: redirect
      in: query
      required: false
      description: "`true`면 JSON 대신 302로 제공자의 로그인 페이지로 보낸다"
      schema:
        type: boolean
        default: false
    OAuthCode:
      name: code
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OAuthState:
      name: state
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OAuthError:
      name: error
      in: query
      required: false
      description: "제공자가 돌려준 오류 (예: `access_denied`). 있으면 400 `OAuth authorization failed: <앞 200자>`"
      schema:
        type: string
    OAuthCodeVerifier:
      name: code_verifier
      in: query
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~-]{43,128}$"

  responses:
    ValidationError:
      description: |
        요청 검증 실패. 항목마다 `type`·`loc`·`msg`만 있다 (FastAPI 기본 형식에서 입력값 `input`과 `ctx`를 뺀 것. 받은 값을
        되돌려 주지 않는다). 오류는 앞에서부터 20개까지만 싣고, 64자를 넘는 `loc` 항목(보낸 쪽이 정한 키 이름)은
        `<long key>`로 바꾼다. 문자열에 NUL이 있으면
        `Value error, must not contain NUL or unpaired surrogate characters`(`type: value_error`), 짝 없는 서로게이트가 있으면
        FastAPI(pydantic) 기본 메시지 `Input should be a valid string, unable to parse raw data as a unicode string`
        (`type: string_unicode`), 한 줄 필드에 제어 문자·U+2028·U+2029가 있으면
        `Value error, must be a single line without control characters`다. 검사를 지나친 저장할 수 없는 문자(NUL·짝 없는
        서로게이트)가 DB 단계에서 걸려도 첫 메시지의 422(`loc: []`)로 답한다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          examples:
            unstorable:
              value:
                detail:
                  - type: value_error
                    loc: [body, token]
                    msg: "Value error, must not contain NUL or unpaired surrogate characters"
            unpairedSurrogate:
              value:
                detail:
                  - type: string_unicode
                    loc: [body, token]
                    msg: "Input should be a valid string, unable to parse raw data as a unicode string"
            notSingleLine:
              value:
                detail:
                  - type: value_error
                    loc: [body, name]
                    msg: "Value error, must be a single line without control characters"
    ContentTooLarge:
      description: |
        요청 본문이 그 경로의 상한을 넘음. 상한은 기본 64 KiB(65,536바이트)이고, 토큰 없이 부르는 회원가입·로그인·소셜 로그인
        콜백(POST)은 16 KiB(16,384바이트), `POST /api/v1/verify`는 320 KiB(327,680바이트), 연구자용
        `POST /api/v1/research/job-postings/preview`·`/api/v1/research/job-postings`·`/api/v1/research/learning-resources`는
        2 MiB(2,097,152바이트)다. `Content-Length`가 상한보다 크면 인증과 관계없이 본문을 읽지 않고
        텍스트 `Content Too Large`로 답한다. `Content-Length` 없는 chunked 전송은 읽은 양이 상한을 넘는 순간 JSON으로 끊는다.
        응답 형식은 상한과 관계없이 같다.
      content:
        text/plain:
          schema:
            type: string
          example: Content Too Large
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Content Too Large
    TextExpandsTooMuch:
      description: |
        요청 형식 오류(422, `ValidationError` 참고), 또는 원문·인용을 NFKC 정규화 + 대소문자 통일 + 공백 정리한 결과가 원래 길이의
        2배 + 64자를 넘음(예: U+FDFA 한 글자는 18자가 됨). 뒤의 경우는 AI 서비스의 422를 그대로 전달하며 저장하지 않는다.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            detail: TEXT_EXPANDS_TOO_MUCH_WHEN_NORMALIZED
            code: TEXT_EXPANDS_TOO_MUCH_WHEN_NORMALIZED
    InternalError:
      description: 서버 내부 오류. 내부 예외 메시지는 노출하지 않는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Internal server error
    ServiceBusy:
      description: |
        DB가 바쁨. 서버 프로세스(태스크)의 DB 연결 자리(`DB_MAX_CONNECTIONS`)를 5초 안에 얻지 못했거나, DB 문장이 15초를
        넘었거나, 잠금을 5초 안에 얻지 못했거나, DB에 접속하지 못했다(접속 거부·시간 초과·서버가 연결을 끊음).
        `Retry-After`(초) 뒤에 다시 시도한다.
        DB를 쓰는 모든 API가 돌려줄 수 있다.
      headers:
        Retry-After:
          description: 다시 시도할 수 있을 때까지의 초
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Service is busy. Try again later.
    Unauthorized:
      description: |
        인증 실패. 토큰이 없거나(서버 설정과 관계없이 항상), 잘못되었거나, 만료되었거나, 로그아웃으로 무효가 되었거나,
        계정이 없어짐. 사용자 전용 API를 서비스 키로 부른 경우도 401이다. `WWW-Authenticate: Bearer` 헤더 포함.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            required:
              value: { detail: Authentication required }
            invalid:
              value: { detail: Invalid token }
            expired:
              value: { detail: Token expired }
    NotFound:
      description: 없거나 본인 것이 아님
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 남의 DID에 접근하거나, 이 계정에 허용되지 않은 기능(연구자 공고·학습자료 반입, 커리큘럼 LLM 모드)을 부름
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: "Forbidden: not your DID"
    ResearcherRequired:
      description: |
        연구자 계정(서버 설정 `RESEARCHER_USER_IDS`)이 아님. 본문 형식 검사(422)보다 먼저 확인하므로, 연구자가 아닌 계정은
        본문이 틀려도 이 응답을 받는다 (본문이 경로의 상한 2 MiB를 넘으면 그보다 먼저 413).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Researcher permission required
    OAuthAuthorized:
      description: 인가 URL 발급 성공
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthAuthorizeResponse"
    OAuthAuthorizeBadRequest:
      description: 허용되지 않은 `redirect_uri` 또는 잘못된 PKCE 파라미터
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            redirectUri:
              value: { detail: Invalid redirect_uri }
            codeChallenge:
              value: { detail: Invalid code_challenge }
            challengeMethod:
              value: { detail: Only S256 code_challenge_method is supported }
    OAuthLoggedIn:
      description: 소셜 로그인/가입 성공 (`POST /api/v1/users/login`과 같은 형식. `message`는 info.description "소셜 로그인")
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResponse"
    OAuthCallbackBadRequest:
      description: |
        잘못되거나 만료된 `state`(다른 제공자의 `state` 포함), `redirect_uri`가 `state`와 다름, 만료·재사용된 인가 코드,
        제공자 액세스 토큰 거절(사용자 정보 조회 401), 이메일 없음(동의 거절, GitHub 이메일 권한 거절·기본 이메일 없음 등),
        제공자가 인증하지 않은 이메일(Google, GitHub 기본 이메일 미인증·토큰 오류 `unverified_user_email`).
        GET 콜백은 `error` 쿼리(사용자 취소 등)나 빠진 `code`·`state`도 400이다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            state:
              value: { detail: Invalid or expired OAuth state }
            redirectUriMismatch:
              value: { detail: redirect_uri does not match OAuth state }
            code:
              value: { detail: Invalid or expired OAuth authorization code }
            accessToken:
              value: { detail: Invalid OAuth access token }
            emailRequired:
              value: { detail: OAuth email is required }
            emailNotVerified:
              value: { detail: OAuth email is not verified }
    OAuthDevelopmentOnly:
      description: "`APP_ENV=production` (이 경로를 쓰지 않는다)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Not Found
    OAuthAccountConflict:
      description: |
        소셜 로그인을 같은 이메일의 기존 계정에 붙일 수 없음 (info.description "소셜 로그인"의 계정 규칙).
        같은 제공자의 다른 계정이 이미 연동되어 있거나, 그 계정에 비밀번호가 있거나(그 계정에는 연동하지 않는다),
        이메일이 양쪽에서 확인되지 않았다(이번 로그인이 네이버이거나, 그 계정에 같은 이메일의 Google·GitHub 연동이 없음).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            passwordAccount:
              value:
                detail: This email is registered with a password. Log in with your email and password.
            otherMethod:
              value:
                detail: This email is already used by another sign-in method. Log in with that method.
            otherAccountOfSameProvider:
              value:
                detail: User is already linked to another account for this provider
    TooManyOAuthExchanges:
      description: |
        그 제공자의 토큰 교환 한도 초과 (서버 프로세스(태스크)마다 제공자별 분당 300번, 그 제공자의 모든 사용자가 함께 쓴다).
        제공자를 부르지 않는다. `Retry-After`(초) 뒤에 다시 시도한다.
      headers:
        Retry-After:
          description: 다시 시도할 수 있을 때까지의 초
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Too many attempts. Try again later.
    OAuthProviderError:
      description: |
        제공자(Google·GitHub·네이버) 호출 실패 (연결 실패·시간 초과, 2xx가 아닌 응답(리디렉션 포함), JSON이 아니거나 너무 깊게
        중첩된 본문, 쓸 수 있는 `access_token` 없음, 인가 코드 문제가 아닌 토큰 오류(예: GitHub `incorrect_client_credentials`),
        사용자 정보의 식별자·이메일이 문자열이 아니거나 255자를 넘거나 한 줄이 아님, GitHub `id`가 1~2^63-1의 JSON 정수가 아님,
        GitHub 이메일 목록이 JSON 배열이 아님, 네이버 `resultcode`가 `"00"`이 아님). 응답은 제공자 이름이 든 고정 문구와 `code`뿐이고
        원인은 BE 로그(`Provider error: ...`)에만 남는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            google:
              value: { detail: Google OAuth error, code: PROVIDER_ERROR }
            github:
              value: { detail: GitHub OAuth error, code: PROVIDER_ERROR }
            naver:
              value: { detail: Naver OAuth error, code: PROVIDER_ERROR }
    OAuthNotConfigured:
      description: 그 제공자의 설정 누락 (`<GOOGLE|GITHUB|NAVER>_CLIENT_ID`/`_CLIENT_SECRET`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            google:
              value: { detail: Google OAuth is not configured, code: PROVIDER_NOT_CONFIGURED }
            github:
              value: { detail: GitHub OAuth is not configured, code: PROVIDER_NOT_CONFIGURED }
            naver:
              value: { detail: Naver OAuth is not configured, code: PROVIDER_NOT_CONFIGURED }
    TooManyAnalysisRequests:
      description: |
        사용자별 AI 묶음 요청 한도 초과 (공고 목록·학습자료 검색·직무 비교·학습 계획이 같은 몫을 쓴다). 한 사용자가 동시에 쥐는
        묶음 요청은 2개, 요청 수는 분당 30번·시간당 300번까지다. 넘으면 기다리지 않고 DB의 묶음도 AI도 부르지 않는다.
        `Retry-After`(초. 동시 수 초과면 2, 요청 수 초과면 몫이 다시 찰 때까지) 뒤에 다시 시도한다.
      headers:
        Retry-After:
          description: 다시 시도할 수 있을 때까지의 초
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Too many analysis requests. Try again later.
    TooManyVerifications:
      description: |
        검증기(DXWorks) 호출 한도 초과. 호출자(사용자, 서비스 키는 하나로)마다 분당 120번과 시간당 1,200번, 서버 프로세스(태스크)
        전체로 분당 600번까지다. 이번 요청에 필요한 호출 수가 남은 몫보다 많으면 검증기를 한 번도 부르지 않고 아무것도 저장하지 않는다.
        `POST /api/v1/verify`의 배지 검증은 검증기까지 가서 토큰이 거절된 요청이 호출자마다 10분에 10번을 넘은 경우에도 이 응답이다.
        `Retry-After`(초. 모자란 몫이 다시 찰 때까지의 시간 가운데 가장 긴 값) 뒤에 다시 시도한다.
      headers:
        Retry-After:
          description: 다시 시도할 수 있을 때까지의 초
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Too many verification requests. Try again later.
    ProviderError:
      description: |
        DXWorks 호출 실패 (연결 실패·시간 초과(교환이 `DXWORKS_TIMEOUT_SECONDS`의 2배를 넘거나, 동시 호출 자리를 그 2배 동안
        얻지 못한 경우 포함)·협력사 오류 응답·리디렉션(3xx, 본문이 JSON이어도 결과로 읽지 않음)·
        형식 오류(JSON이 아니거나 너무 깊게 중첩된 본문, NaN·Infinity·범위를 넘는 숫자, 전송된 크기나 풀어낸 크기가 1 MiB를 넘는
        본문, `gzip`·`deflate`가 아닌 방식으로 압축됐거나 압축을 풀 수 없는 본문,
        배지 검증 응답의 `valid`가 참·거짓이 아닌 경우 포함)). 응답은 고정 문구와 `code`뿐이고,
        협력사 오류 코드·메시지는 BE 로그(`Provider error: ...`)에만 남는다(되돌아온 API 키·서명 원본·DID와, DID·JWT 모양이거나
        숫자가 섞인 32자 이상의 base64url 문자열은 `[redacted]`로 가린다. 협력사의 UUID·추적 ID도 이 모양이면 가려져 로그에 남지
        않고, 글자와 `_`·`-`로만 된 오류 코드는 길어도 그대로 남는다. 그래서 보낸 값 그대로가 아닌 조각은 숫자가 없으면 남을 수 있다).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Credential service error
            code: PROVIDER_ERROR
    ProviderUnavailable:
      description: |
        발급·검증 인프라 설정 누락·사용 불가 (`DXWORKS_API_HOST`가 없거나 `https://` 주소가 아님(`http://`는 루프백만),
        `DXWORKS_API_KEY`, `DXWORKS_BADGE_TEMPLATE_ID` 등). 어느 설정인지는 BE 로그(`Provider error: ...`)에만 남는다.
        (형식이 틀린 `DXWORKS_API_HOST`·`DXWORKS_API_KEY`·`DXWORKS_TIMEOUT_SECONDS`를 넣으면 서버가 시작하지 않는다.)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Credential service is not configured
            code: PROVIDER_NOT_CONFIGURED

    AIUnavailable:
      description: |
        AI 서비스 연결 실패·토큰 불일치·미설정 (FE는 "AI 서버에 연결할 수 없습니다"로 표시).
        `code` 예: AI_SERVICE_UNAVAILABLE(연결 실패·시간 초과), AI_SERVICE_ERROR(형식 ID 없는 5xx: 프록시·비정상 종료),
        AI_SERVICE_AUTH_FAILED, AI_SERVICE_NOT_CONFIGURED. AI가 보낸 5xx는 AI의 code를 그대로 싣는다.
        AI_SERVICE_BUSY(`AI service is busy. Try again later.`)는 AI로 보내는 묶음 요청의 동시 수 상한(`AI_MAX_CONCURRENCY`)에
        걸려 10초를 기다려도 자리가 없던 경우다. AI를 부르지 않았고 `Retry-After`(초) 헤더가 붙는다.
        직무 비교(`POST /api/v1/career-analyses`)는 자격증명 재검증을 마친 뒤에 자리를 기다리므로, 이 응답이어도 그 요청의
        검증기 호출 몫은 이미 쓴 상태다. 학습 계획(`POST /api/v1/curricula`)에서 AI가 다시 시도할 수 있다고 답한 생성 실패
        (`LLM_BUSY`: AI의 동시 LLM 생성 상한, `LLM_PROVIDER_UNAVAILABLE`, Claude 429·5xx의 `LLM_PROVIDER_REJECTED`,
        배포 중 설정이 바뀐 `GENERATOR_CONFIGURATION_CHANGED`)와 다시 시도할 수 있는 AI 연결 실패(`AI_SERVICE_UNAVAILABLE` 등)에도
        `Retry-After: 5`가 붙는다.
      headers:
        Retry-After:
          description: |
            (다시 시도할 수 있는 503일 때: AI_SERVICE_BUSY, AI_SERVICE_UNAVAILABLE·AI_SERVICE_ERROR 등 AI 연결 실패, 다시 시도할 수
            있는 학습 계획 생성 실패. AI_SERVICE_NOT_CONFIGURED·AI_SERVICE_AUTH_FAILED·AI_CONFIGURATION_REQUIRED·
            GENERATOR_CONFIGURATION_REQUIRED에는 없다)
            다시 시도할 수 있을 때까지의 초
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: AI service temporarily unavailable
            code: AI_SERVICE_UNAVAILABLE
  requestBodies:
    OAuthCallback:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthCallbackRequest"

  schemas:
    CareerEnvelope:
      type: object
      description: |
        직무 비교·커리큘럼 API 공통 응답. `data`의 정확한 형식은 BE와 AI가 공유하는 Pydantic 모델
        (`BE/app/ai_contract/`, 원본 `ai/src/career/contracts/`)과 FE 타입(`FE/src/types/career.ts`)을 따른다.
      required: [success, data]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
    # ── 공통 ──────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: 사람이 읽을 수 있는 에러 메시지
        code:
          type: string
          description: |
            기계용 사유 코드. AI 연동 오류(예: AI_SERVICE_UNAVAILABLE, AI_CONTRACT_MISMATCH, NO_ELIGIBLE_JOB_SOURCES,
            TEXT_EXPANDS_TOO_MUCH_WHEN_NORMALIZED)와 발급·검증 인프라 오류(PROVIDER_ERROR: 502 `Credential service error`,
            PROVIDER_NOT_CONFIGURED: 503 `Credential service is not configured`), 소셜 로그인 오류(같은 두 코드,
            `detail`은 `<Label> OAuth error` / `<Label> OAuth is not configured`, `<Label>`은 `Google`·`GitHub`·`Naver`)에만 붙고, 그 밖의 에러에는 없다.

    ValidationErrorResponse:
      type: object
      properties:
        detail:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            properties:
              loc:
                type: array
                items:
                  oneOf: [{ type: string, maxLength: 64 }, { type: integer }]
              msg:
                type: string
              type:
                type: string

    HealthResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: ok
        message:
          type: string
          example: VC AI Career Agent BE (FastAPI) is running

    # ── 사용자 ────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, did, email, name]
      properties:
        id:
          type: string
          format: uuid
        did:
          type: string
          description: 사용자 DID (`users.subject_did`)
        email:
          type: string
          format: email
        name:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 한 줄 텍스트 (앞뒤 공백은 잘라 내고, 안쪽의 제어 문자·U+2028·U+2029·방향 제어/보이지 않는 서식 문자·NUL은 422)
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 255
          description: |
            한 줄 텍스트이며 `@`가 하나이고 앞뒤에 보이는 글자가 있어야 한다. 공백·`"(),:;<>[\]`·이형 선택자·CGJ·U+FFFC는 422
            `Value error, Invalid email` (서식 문자(Cf) 등 보이지 않는 글자는 한 줄 검사의 422). 소문자로 저장한다. 255자 상한은 소문자로 바꾼 값에도 적용된다
            (예: `İ`(U+0130)는 두 글자가 되므로 넘으면 422 `Value error, Email must be at most 255 characters`).
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
          description: 8자 이상, UTF-8 기준 72바이트 이하 (bcrypt 제한). bcrypt 해시로 저장된다.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
        password:
          type: string
          format: password
          maxLength: 1024

    AuthResponse:
      type: object
      description: |
        회원가입/로그인 공통 응답 (FE `RegisterResponse`, `LoginResponse`).
        v0.4.0에서 토큰 필드를 최상위에 추가했다. `data`(UserProfile)는 그대로다.
      required: [success, message, data, access_token, token_type, expires_in]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/UserProfile"
        access_token:
          type: string
          description: |
            JWT 액세스 토큰. 이후 요청에 `Authorization: Bearer <access_token>`으로 보낸다.
            발급 시점의 계정 토큰 버전(`ver` 클레임)이 들어 있어, 로그아웃하면 이 토큰도 401이 된다.
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          description: 토큰 만료까지 남은 초 (서버 `JWT_EXPIRES_MINUTES`, 1~1440분, 기본 1일)

    OAuthAuthorizeResponse:
      type: object
      required: [success, provider, authorization_url, state, expires_in]
      properties:
        success:
          type: boolean
        provider:
          type: string
          enum: [google, github, naver]
          example: google
        authorization_url:
          type: string
          format: uri
        state:
          type: string
          description: 서명된 OAuth state 토큰 (유효기간 10분)
        expires_in:
          type: integer
          example: 600

    OAuthCallbackRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 2048
          description: 제공자(Google·GitHub·네이버)가 돌려준 인가 코드 (앞뒤 공백은 잘라 낸다)
        state:
          type: string
          minLength: 1
          maxLength: 2048
          description: "`GET .../authorize`가 발급한 서명된 state"
        redirect_uri:
          type: string
          maxLength: 2048
          description: 보내면 state에 든 콜백 주소와 같아야 한다 (다르면 400)
        code_verifier:
          type: string
          pattern: "^[A-Za-z0-9._~-]{43,128}$"
          description: PKCE code_verifier (RFC 7636). 빈 문자열·공백뿐이면 없는 것으로 본다. 네이버는 형식만 검사하고 제공자로 보내지 않는다

    # ── 자격증명 ──────────────────────────────────────────────
    CredentialStatus:
      type: string
      description: DB `verification_status` ENUM과 같은 값 집합
      enum: [verified, invalid, revoked, expired, unverifiable, pending]

    VerifiedCredential:
      type: object
      required: [record_id, issuer, achievement_name, status, issued_at, raw_data]
      properties:
        record_id:
          type: string
          format: uuid
        issuer:
          type: string
          description: 발급 기관명 (`credentials.issuer_name`)
        achievement_name:
          type: string
          description: 배지/자격명
        status:
          $ref: "#/components/schemas/CredentialStatus"
        issued_at:
          type: string
          format: date-time
        raw_data:
          type: object
          additionalProperties: true
          description: 원본 VC JSON 전문

    CareersResponse:
      type: object
      required: [user_profile, verified_credentials]
      properties:
        user_profile:
          $ref: "#/components/schemas/UserProfile"
        verified_credentials:
          type: array
          description: |
            이름과 달리 현재는 검증 상태와 관계없이 모든 자격증명이 들어 있다. `status`로 구분한다.
          items:
            $ref: "#/components/schemas/VerifiedCredential"

    # ── 검증 ──────────────────────────────────────────────────
    VerifyRequest:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          enum: [identity, badge]
        token:
          type: string
          minLength: 1
          maxLength: 262144
          description: |
            `identity`면 VP 토큰(서버에서 신원 검증을 켠 경우만), `badge`면 OB3 VC-JWT (최대 256 KiB, NUL·짝 없는 서로게이트는 422).
            compact JWS 모양(ASCII, `머리말.본문.서명` base64url 세 조각, 머리말의 `alg`가 `none`이 아닌 문자열)이 아니면
            검증기로 보내지 않는다. 조각 끝의 `=` 패딩(둘까지)과 SD-JWT 형식(`<jws>~<disclosure>~...~[<kb-jwt>]`)은 받는다
            (`POST /api/v1/verify` 설명 참고).

    VerifyResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          description: 검증 통과 여부 (`badge`면 `data.status == verified`)
        message:
          type: string
        data:
          description: |
            BE 공통 형식의 검증 결과. 외부 검증기(협력사 API) 응답 원문은 내보내지 않는다 (v0.4.0 변경).
          oneOf:
            - $ref: "#/components/schemas/BadgeVerification"
            - $ref: "#/components/schemas/IdentityVerification"

    VerificationCheck:
      type: object
      required: [name, result]
      properties:
        name:
          type: string
          enum: [schema, recipient, signature, issuer_trust, revocation, expiration, did_resolution, anchor_match]
        result:
          type: string
          enum: [pass, fail, warn, skip]
        detail:
          type: [string, "null"]

    BadgeVerification:
      type: object
      required: [record_id, status, valid, achievement_name, issuer_name, issuer_trusted, recipient_did,
                 issued_at, expires_at, checks]
      properties:
        record_id:
          type: [string, "null"]
          format: uuid
          description: |
            저장된 자격증명 ID. 검증기가 발급자 서명·신뢰를 확인하지 못했거나 원본을 해석할 수 없어 저장하지 않았으면 null
        status:
          $ref: "#/components/schemas/CredentialStatus"
        valid:
          type: boolean
        achievement_name:
          type: string
        issuer_name:
          type: string
        issuer_trusted:
          type: [boolean, "null"]
          description: 발급기관이 신뢰 레지스트리에 있는지 (검증기가 알려주지 않으면 null)
        recipient_did:
          type: [string, "null"]
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        checks:
          type: array
          items:
            $ref: "#/components/schemas/VerificationCheck"

    IdentityVerification:
      type: object
      required: [verified, holder_did, claims]
      properties:
        verified:
          type: boolean
        holder_did:
          type: [string, "null"]
          description: VP 홀더 DID. 200 응답에서는 항상 토큰 사용자 본인 DID다 (다르거나 없으면 403)
        claims:
          type: object
          additionalProperties: true

    # ── 모의 발급 ─────────────────────────────────────────────
    IssueMockBadgeRequest:
      type: object
      required: [holderDid]
      properties:
        templateId:
          type: [string, "null"]
          maxLength: 255
          description: |
            배지 템플릿 ID. 생략하거나 비우면 서버 `.env`의 `DXWORKS_BADGE_TEMPLATE_ID`를 쓴다.
            그 밖의 값은 서버 설정 `MOCK_ISSUER_TEMPLATE_IDS`에 있어야 한다 (아니면 403 `Template not allowed`).
        holderDid:
          type: string
          minLength: 5
          maxLength: 255
          description: 배지를 받을 사용자 DID. 토큰 사용자 본인 DID여야 한다 (아니면 403)

    IssueMockBadgeResponse:
      type: object
      required: [success, message, vcJwt]
      properties:
        success:
          type: boolean
        message:
          type: string
        vcJwt:
          type: string
          description: DXWorks가 서명한 OB3 VC-JWT

    # ── 실행 시점 재검증 ──────────────────────────────────────
    Evidence:
      type: object
      description: 서명 원본에서 뽑은 근거 + 요청 시점 검증 결과 (발급기관마다 다른 표기를 같은 형식으로 정리)
      required: [record_id, status, verified, achievement_name, achievement_description, criteria,
                 issuer_name, issued_at, expires_at, verified_at, checks]
      properties:
        record_id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/CredentialStatus"
        verified:
          type: boolean
          description: 지금 검증을 통과했는지
        achievement_name: { type: string }
        achievement_description: { type: [string, "null"] }
        criteria: { type: [string, "null"], description: 성취 기준 설명 }
        issuer_name: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        verified_at:
          type: [string, "null"]
          format: date-time
          description: 이번에 검증한 시각. 서명 원본이 없어 검증하지 못했으면 null
        checks:
          type: array
          items:
            $ref: "#/components/schemas/VerificationCheck"

    ExcludedEvidence:
      type: object
      required: [record_id, status, reason]
      properties:
        record_id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/CredentialStatus"
        reason:
          type: string
          description: |
            예: no_signed_original(서명 원본 없음), revoked, expired, invalid, verifier_error(검증기 호출 실패).
            포트폴리오 생성·직무 비교는 검증기 장애(설정 누락·연결 실패·시간 초과·5xx·408·429·401·403·3xx)면 저장하지 않고
            502/503으로 끝나므로, 거기서 verifier_error는 특정 자격증명에 대한 거절(400·404·422 등 그 밖의 4xx)이나 형식이 맞지 않는
            2xx 응답(JSON이 아니거나 너무 깊게 중첩된 본문 등)일 때만 나온다. 재검증 한 건(`POST .../reverify`)도 같은 분류다.

    EvidenceResponse:
      type: object
      required: [subject_did, mode, evidence, excluded]
      properties:
        subject_did: { type: string }
        mode: { type: string, enum: [strict, labeled] }
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        excluded:
          type: array
          description: "`strict`에서 제외된 자격증명. `labeled`에서는 항상 빈 배열"
          items:
            $ref: "#/components/schemas/ExcludedEvidence"

    # ── 포트폴리오 ────────────────────────────────────────────
    PortfolioCreateRequest:
      type: object
      additionalProperties: false
      required: [title, record_ids, source]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: 한 줄 텍스트 (앞뒤 공백은 잘라 내고, 안쪽의 제어 문자·U+2028·U+2029·NUL은 422)
        target_role:
          type: [string, "null"]
          maxLength: 100
          description: 한 줄 텍스트 (제목과 같은 규칙). 비우면 없음
        record_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
        source:
          type: string
          const: VC_ONLY
          description: 근거 출처. 검증된 자격증명만 쓴다는 표시로 항상 VC_ONLY

    PortfolioUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: 한 줄 텍스트 (생성과 같은 규칙). 공백뿐이거나 null이면 422 `Title must not be blank`
        target_role:
          type: [string, "null"]
          maxLength: 100
          description: 한 줄 텍스트. 비우거나 null이면 희망 직무를 지운다
        status: { type: string, enum: [draft, published] }

    PortfolioSummary:
      type: object
      required: [id, title, target_role, status, credential_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        target_role: { type: [string, "null"] }
        status: { type: string, enum: [draft, published] }
        credential_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Portfolio:
      allOf:
        - $ref: "#/components/schemas/PortfolioSummary"
        - type: object
          required: [source, generator, content_markdown, sections, referenced_record_ids, excluded]
          properties:
            source: { type: string, const: VC_ONLY }
            generator:
              type: string
              description: 본문을 만든 방식. 현재 template (이후 ai)
            content_markdown: { type: string }
            sections:
              type: array
              description: 본문에 들어간 근거 (생성 시점 재검증 결과)
              items:
                $ref: "#/components/schemas/Evidence"
            referenced_record_ids:
              type: array
              items: { type: string, format: uuid }
            excluded:
              type: array
              description: 골랐지만 검증을 통과하지 못해 빠진 자격증명
              items:
                $ref: "#/components/schemas/ExcludedEvidence"

    PortfolioResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          $ref: "#/components/schemas/Portfolio"

    SimpleSuccess:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }

    # ── 선택 공개 ─────────────────────────────────────────────
    ShareCreateRequest:
      type: object
      additionalProperties: false
      required: [record_ids]
      properties:
        record_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
        label:
          type: [string, "null"]
          maxLength: 100
          description: |
            학생이 알아보기 위한 이름 (예 지원 회사명). 기업용 화면에는 보이지 않는다. 한 줄 텍스트다: 앞뒤 공백·줄바꿈은 잘라
            저장하고, 안쪽의 제어 문자(줄바꿈·ESC 등)·U+2028·U+2029·방향 제어/보이지 않는 서식 문자·NUL·짝 없는 서로게이트는 422
        expires_in_days: { type: integer, minimum: 1, maximum: 90, default: 14 }

    ShareSummary:
      type: object
      required: [id, label, record_ids, expires_at, revoked, view_count, last_viewed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: [string, "null"] }
        record_ids:
          type: array
          items: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        revoked: { type: boolean }
        view_count: { type: integer }
        last_viewed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ShareCreated:
      allOf:
        - $ref: "#/components/schemas/ShareSummary"
        - type: object
          required: [token, share_path]
          properties:
            token:
              type: string
              description: 링크 토큰. 이 응답에서만 볼 수 있다
            share_path:
              type: string
              example: /share/3q2-7wZk...
              description: FE 기업용 조회 화면 경로

    SharedCredential:
      description: |
        기업용 조회의 자격증명 하나. `verified_at`은 실제로 검증기에 물은 시각이라 최근 60초 안에 같은 원본을 확인했으면
        그때 시각이다(최대 60초 전).
      allOf:
        - $ref: "#/components/schemas/Evidence"
        - type: object
          required: [vc_jwt]
          properties:
            vc_jwt:
              type: [string, "null"]
              description: 서명 원본. 기업이 직접 검증할 때 사용 (원본이 없으면 null)

    PublicShare:
      type: object
      required: [holder, credentials, verified_at, expires_at]
      properties:
        holder:
          type: object
          required: [name, did]
          properties:
            name: { type: string }
            did: { type: string }
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/SharedCredential"
        verified_at:
          type: string
          format: date-time
          description: 이번 열람 응답을 만든 시각. 자격증명마다 실제로 검증한 시각은 `credentials[].verified_at` (최대 60초 전)
        expires_at: { type: string, format: date-time }
