          description: |
            data = JobVersion. 반입한 연구자 ID(`reviewed_by`)와 `posting.review_note`·`posting.rights_basis`·`posting.raw_text`는
            빼고 돌려준다 (연구자를 포함한 모든 호출자에게 같음. 저장된 버전·`content_hash`는 그대로)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 저장본의 내용 해시가 맞지 않음 (Job source integrity check failed)

  /api/v1/learning-resources:
    get:
      tags: [career]
      summary: 조건에 맞는 학습자료 검색
      operationId: searchLearningResources
      security:
        - bearerAuth: []
      parameters:
        - { name: skill_id, in: query, required: false, schema: { type: string } }
        - { name: budget_krw, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: |
            data = LearningResourceVersion[]. 항목마다 반입한 연구자 ID(`reviewed_by`)와
            `resource.review_note`·`resource.rights_basis`·`resource.raw_text`는 빼고 돌려준다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/career-analyses:
    post:
      tags: [career]
      summary: 직무 비교 (실행 시점 재검증 → AI 비교)
      description: |
        사용자의 **모든 자격증명을 지금 다시 검증**하고 통과한 것만 근거로 AI가 공고 요구사항과 비교한다.
        요구사항별 상태: `supported` / `partially_supported` / `not_evidenced`(근거 없음 ≠ 역량 없음) / `unknown`(판단 보류).
        결과는 5분(`valid_until`) 동안 커리큘럼 생성에 쓸 수 있다. AI 응답이 BE가 보낸 근거 밖을 인용하면 502.
      operationId: createCareerAnalysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_posting_id: { type: string, format: uuid, description: "비우면 전체 공고 기준" }
                region: { type: string }
                seniority: { type: string, enum: [entry, junior, mid, senior, unspecified] }
            example:
              target_posting_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        "201":
          description: "data = CareerAnalysis (comparisons[], skill_evidence[], excluded_record_ids[], warnings[], valid_until)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 대상 공고가 마감·오래됨·필터 밖, 또는 비교 중 공고가 바뀜
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          description: 비교에 쓸 공고가 없음 (No eligible reviewed job sources; import sources first)
        "502":
          description: |
            AI 응답이 계약·BE 재검사를 통과하지 못함 (`code` 예: AI_CONTRACT_MISMATCH, AI_RESPONSE_INVALID,
            AI_ANALYSIS_INVARIANT_FAILED), 또는 재검증 중 DXWorks 호출 실패
            (`{ "detail": "Credential service error", "code": "PROVIDER_ERROR" }`, 협력사 메시지는 BE 로그에만).
            어느 경우든 분석을 저장하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: AI service response failed contract checks
                code: AI_ANALYSIS_INVARIANT_FAILED
        "503":
          description: |
            AI 서비스 연결 실패·토큰 불일치·미설정 (`code` 포함, AIUnavailable 참고), 또는 재검증 중 DXWorks 설정 누락·사용 불가
            (`code`: PROVIDER_NOT_CONFIGURED, 빠진 설정 이름은 BE 로그에만). 어느 경우든 분석을 저장하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ai:
                  value: { detail: AI service temporarily unavailable, code: AI_SERVICE_UNAVAILABLE }
                verifier:
                  value: { detail: Credential service is not configured, code: PROVIDER_NOT_CONFIGURED }

  /api/v1/career-analyses/{analysis_id}:
    get:
      tags: [career]
      summary: 내 직무 비교 결과 조회 (과거 시점 결과)
      operationId: getCareerAnalysis
      security:
        - bearerAuth: []
      parameters:
        - { name: analysis_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "data = {analysis, historical_only: true}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/curricula:
    post:
      tags: [career]
      summary: 학습 계획 생성 (동기)
      description: |
        본문은 `CurriculumRequest` (`BE/app/ai_contract/curriculum.py`). 같은 `idempotency_key`로 같은 본문을 보내면 같은 결과, 다른 본문이면 409.
        `mode=llm`은 `CURRICULUM_LLM_USER_IDS`에 있는 계정 + `allow_external_processing=true`일 때만 (아니면 403/422).
        분석이 만료되었으면 409. LLM은 허용된 단계·자료·시간만 고르며, 초안이 검사를 통과하지 못하면 템플릿으로 대체한다.
      operationId: createCurriculum
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "CurriculumRequest" }
            example:
              analysis_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              idempotency_key: 9b2f7c1e-1c2d-4e5f-8a9b-0c1d2e3f4a5b
              weeks: 8
              hours_per_week: 6
              budget_krw: 0
              mode: template
              learning_choices: [{ skill_id: spark, action: learn }]
      responses:
        "201":
          description: |
            data = {curriculum_id, request, result: CurriculumResult, created_at}. `result.steps[].resource`는
            `GET /api/v1/learning-resources`와 같은 형태다(`reviewed_by`, `resource.review_note`·`rights_basis`·`raw_text` 제외)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 분석 만료, 자료 변경, 또는 같은 키의 다른 요청
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "503":
          $ref: "#/components/responses/AIUnavailable"

  /api/v1/curricula/{curriculum_id}:
    get:
      tags: [career]
      summary: 내 학습 계획 조회
      operationId: getCurriculum
      security:
        - bearerAuth: []
      parameters:
        - { name: curriculum_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: |
            data = {curriculum_id, request, result, created_at, historical_only: true}. `result.steps[].resource`는
            `GET /api/v1/learning-resources`와 같은 형태다(이 변경 전에 저장한 커리큘럼도 같음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인/회원가입 응답의 `access_token`
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: 선택 사항인 내부 서비스용 키(현재 쓰는 곳 없음). 서버 `SERVICE_API_KEY`와 같아야 한다. 읽기 API만 허용.

  parameters:
    RecordId:
      name: record_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PortfolioId:
      name: portfolio_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Did:
      name: did
      in: path
      required: true
      description: 조회 대상 사용자의 DID (`users.subject_did`). 경로에 넣을 때 URL 인코딩한다.
      schema:
        type: string
      example: did:key:z6MkMock1a2b3c4d5e6f

  responses:
    ValidationError:
      description: |
        요청 검증 실패 (FastAPI 기본 형식). 문자열에 NUL이 있으면
        `Value error, must not contain NUL or unpaired surrogate characters`(`type: value_error`), 짝 없는 서로게이트가 있으면
        FastAPI(pydantic) 기본 메시지 `Input should be a valid string, unable to parse raw data as a unicode string`
        (`type: string_unicode`), 한 줄 필드에 제어 문자·U+2028·U+2029가 있으면
        `Value error, must be a single line without control characters`다. 검사를 지나친 저장할 수 없는 문자(NUL·짝 없는
        서로게이트)가 DB 단계에서 걸려도 첫 메시지의 422(`loc: []`)로 답한다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          examples:
            unstorable:
              value:
                detail:
                  - type: value_error
                    loc: [body, token]
                    msg: "Value error, must not contain NUL or unpaired surrogate characters"
            unpairedSurrogate:
              value:
                detail:
                  - type: string_unicode
                    loc: [body, token]
                    msg: "Input should be a valid string, unable to parse raw data as a unicode string"
            notSingleLine:
              value:
                detail:
                  - type: value_error
                    loc: [body, name]
                    msg: "Value error, must be a single line without control characters"
    ContentTooLarge:
      description: |
        요청 본문이 2 MiB(2,097,152바이트)를 넘음. `Content-Length`가 이보다 크면 인증과 관계없이 본문을 읽지 않고
        텍스트 `Content Too Large`로 답한다. `Content-Length` 없는 chunked 전송은 읽은 양이 2 MiB를 넘는 순간 JSON으로 끊는다.
      content:
        text/plain:
          schema:
            type: string
          example: Content Too Large
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Content Too Large
    TextExpandsTooMuch:
      description: |
        요청 형식 오류(FastAPI 기본 422), 또는 원문·인용을 NFKC 정규화 + 대소문자 통일 + 공백 정리한 결과가 원래 길이의
        2배 + 64자를 넘음(예: U+FDFA 한 글자는 18자가 됨). 뒤의 경우는 AI 서비스의 422를 그대로 전달하며 저장하지 않는다.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            detail: TEXT_EXPANDS_TOO_MUCH_WHEN_NORMALIZED
            code: TEXT_EXPANDS_TOO_MUCH_WHEN_NORMALIZED
    InternalError:
      description: 서버 내부 오류. 내부 예외 메시지는 노출하지 않는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Internal server error
    Unauthorized:
      description: |
        인증 실패. 토큰이 없거나(서버 설정과 관계없이 항상), 잘못되었거나, 만료되었거나, 로그아웃으로 무효가 되었거나,
        계정이 없어짐. 사용자 전용 API를 서비스 키로 부른 경우도 401이다. `WWW-Authenticate: Bearer` 헤더 포함.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            required:
              value: { detail: Authentication required }
            invalid:
              value: { detail: Invalid token }
            expired:
              value: { detail: Token expired }
    NotFound:
      description: 없거나 본인 것이 아님
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 남의 DID에 접근하거나, 이 계정에 허용되지 않은 기능(연구자 공고·학습자료 반입, 커리큘럼 LLM 모드)을 부름
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: "Forbidden: not your DID"
    ProviderError:
      description: |
        DXWorks 호출 실패 (연결 실패·시간 초과·협력사 오류 응답·리디렉션(3xx, 본문이 JSON이어도 결과로 읽지 않음)·
        형식 오류(JSON이 아니거나 너무 깊게 중첩된 본문 포함)). 응답은 고정 문구와 `code`뿐이고,
        협력사 오류 코드·메시지는 BE 로그(`Provider error: ...`)에만 남는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Credential service error
            code: PROVIDER_ERROR
    ProviderUnavailable:
      description: |
        발급·검증 인프라 설정 누락·사용 불가 (`DXWORKS_API_HOST`가 없거나 `https://` 주소가 아님(`http://`는 루프백만),
        `DXWORKS_API_KEY`, `DXWORKS_BADGE_TEMPLATE_ID` 등). 어느 설정인지는 BE 로그(`Provider error: ...`)에만 남는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Credential service is not configured
            code: PROVIDER_NOT_CONFIGURED

    AIUnavailable:
      description: |
        AI 서비스 연결 실패·토큰 불일치·미설정 (FE는 "AI 서버에 연결할 수 없습니다"로 표시).
        `code` 예: AI_SERVICE_UNAVAILABLE(연결 실패·시간 초과), AI_SERVICE_ERROR(형식 ID 없는 5xx: 프록시·비정상 종료),
        AI_SERVICE_AUTH_FAILED, AI_SERVICE_NOT_CONFIGURED. AI가 보낸 5xx는 AI의 code를 그대로 싣는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: AI service temporarily unavailable
            code: AI_SERVICE_UNAVAILABLE
  schemas:
    CareerEnvelope:
      type: object
      description: |
        직무 비교·커리큘럼 API 공통 응답. `data`의 정확한 형식은 BE와 AI가 공유하는 Pydantic 모델
        (`BE/app/ai_contract/`, 원본 `ai/src/career/contracts/`)과 FE 타입(`FE/src/types/career.ts`)을 따른다.
      required: [success, data]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
    # ── 공통 ──────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: 사람이 읽을 수 있는 에러 메시지
        code:
          type: string
          description: |
            기계용 사유 코드. AI 연동 오류(예: AI_SERVICE_UNAVAILABLE, AI_CONTRACT_MISMATCH, NO_ELIGIBLE_JOB_SOURCES,
            TEXT_EXPANDS_TOO_MUCH_WHEN_NORMALIZED)와 발급·검증 인프라 오류(PROVIDER_ERROR: 502 `Credential service error`,
            PROVIDER_NOT_CONFIGURED: 503 `Credential service is not configured`)에만 붙고, 그 밖의 에러에는 없다.

    ValidationErrorResponse:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf: [{ type: string }, { type: integer }]
              msg:
                type: string
              type:
                type: string

    HealthResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: ok
        message:
          type: string
          example: VC AI Career Agent BE (FastAPI) is running

    # ── 사용자 ────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, did, email, name]
      properties:
        id:
          type: string
          format: uuid
        did:
          type: string
          description: 사용자 DID (`users.subject_did`)
        email:
          type: string
          format: email
        name:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 한 줄 텍스트 (앞뒤 공백은 잘라 내고, 안쪽의 제어 문자·U+2028·U+2029·NUL은 422)
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 255
          description: |
            한 줄 텍스트이며 `@`를 포함해야 한다. 소문자로 저장한다. 255자 상한은 소문자로 바꾼 값에도 적용된다
            (예: `İ`(U+0130)는 두 글자가 되므로 넘으면 422 `Value error, Email must be at most 255 characters`).
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
          description: 8자 이상, UTF-8 기준 72바이트 이하 (bcrypt 제한). bcrypt 해시로 저장된다.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
        password:
          type: string
          format: password
          maxLength: 1024

    AuthResponse:
      type: object
      description: |
        회원가입/로그인 공통 응답 (FE `RegisterResponse`, `LoginResponse`).
        v0.4.0에서 토큰 필드를 최상위에 추가했다. `data`(UserProfile)는 그대로다.
      required: [success, message, data, access_token, token_type, expires_in]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/UserProfile"
        access_token:
          type: string
          description: |
            JWT 액세스 토큰. 이후 요청에 `Authorization: Bearer <access_token>`으로 보낸다.
            발급 시점의 계정 토큰 버전(`ver` 클레임)이 들어 있어, 로그아웃하면 이 토큰도 401이 된다.
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          description: 토큰 만료까지 남은 초 (서버 `JWT_EXPIRES_MINUTES`, 1~1440분, 기본 1일)

    # ── 자격증명 ──────────────────────────────────────────────
    CredentialStatus:
      type: string
      description: DB `verification_status` ENUM과 같은 값 집합
      enum: [verified, invalid, revoked, expired, unverifiable, pending]

    VerifiedCredential:
      type: object
      required: [record_id, issuer, achievement_name, status, issued_at, raw_data]
      properties:
        record_id:
          type: string
          format: uuid
        issuer:
          type: string
          description: 발급 기관명 (`credentials.issuer_name`)
        achievement_name:
          type: string
          description: 배지/자격명
        status:
          $ref: "#/components/schemas/CredentialStatus"
        issued_at:
          type: string
          format: date-time
        raw_data:
          type: object
          additionalProperties: true
          description: 원본 VC JSON 전문

    CareersResponse:
      type: object
      required: [user_profile, verified_credentials]
      properties:
        user_profile:
          $ref: "#/components/schemas/UserProfile"
        verified_credentials:
          type: array
          description: |
            이름과 달리 현재는 검증 상태와 관계없이 모든 자격증명이 들어 있다. `status`로 구분한다.
          items:
            $ref: "#/components/schemas/VerifiedCredential"

    # ── 검증 ──────────────────────────────────────────────────
    VerifyRequest:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          enum: [identity, badge]
        token:
          type: string
          minLength: 1
          maxLength: 262144
          description: "`identity`면 VP 토큰, `badge`면 OB3 VC-JWT (최대 256 KiB, NUL·짝 없는 서로게이트는 422)"

    VerifyResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          description: 검증 통과 여부 (`badge`면 `data.status == verified`)
        message:
          type: string
        data:
          description: |
            BE 공통 형식의 검증 결과. 외부 검증기(협력사 API) 응답 원문은 내보내지 않는다 (v0.4.0 변경).
          oneOf:
            - $ref: "#/components/schemas/BadgeVerification"
            - $ref: "#/components/schemas/IdentityVerification"

    VerificationCheck:
      type: object
      required: [name, result]
      properties:
        name:
          type: string
          enum: [schema, recipient, signature, issuer_trust, revocation, expiration, did_resolution, anchor_match]
        result:
          type: string
          enum: [pass, fail, warn, skip]
        detail:
          type: [string, "null"]

    BadgeVerification:
      type: object
      required: [record_id, status, valid, achievement_name, issuer_name, issuer_trusted, recipient_did,
                 issued_at, expires_at, checks]
      properties:
        record_id:
          type: [string, "null"]
          format: uuid
          description: |
            저장된 자격증명 ID. 검증기가 발급자 서명·신뢰를 확인하지 못했거나 원본을 해석할 수 없어 저장하지 않았으면 null
        status:
          $ref: "#/components/schemas/CredentialStatus"
        valid:
          type: boolean
        achievement_name:
          type: string
        issuer_name:
          type: string
        issuer_trusted:
          type: [boolean, "null"]
          description: 발급기관이 신뢰 레지스트리에 있는지 (검증기가 알려주지 않으면 null)
        recipient_did:
          type: [string, "null"]
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        checks:
          type: array
          items:
            $ref: "#/components/schemas/VerificationCheck"

    IdentityVerification:
      type: object
      required: [verified, holder_did, claims]
      properties:
        verified:
          type: boolean
        holder_did:
          type: [string, "null"]
          description: VP 홀더 DID. 200 응답에서는 항상 토큰 사용자 본인 DID다 (다르거나 없으면 403)
        claims:
          type: object
          additionalProperties: true

    # ── 모의 발급 ─────────────────────────────────────────────
    IssueMockBadgeRequest:
      type: object
      required: [holderDid]
      properties:
        templateId:
          type: [string, "null"]
          maxLength: 255
          description: |
            배지 템플릿 ID. 생략하거나 비우면 서버 `.env`의 `DXWORKS_BADGE_TEMPLATE_ID`를 쓴다.
            그 밖의 값은 서버 설정 `MOCK_ISSUER_TEMPLATE_IDS`에 있어야 한다 (아니면 403 `Template not allowed`).
        holderDid:
          type: string
          minLength: 5
          maxLength: 255
          description: 배지를 받을 사용자 DID. 토큰 사용자 본인 DID여야 한다 (아니면 403)

    IssueMockBadgeResponse:
      type: object
      required: [success, message, vcJwt]
      properties:
        success:
          type: boolean
        message:
          type: string
        vcJwt:
          type: string
          description: DXWorks가 서명한 OB3 VC-JWT

    # ── 실행 시점 재검증 ──────────────────────────────────────
    Evidence:
      type: object
      description: 서명 원본에서 뽑은 근거 + 요청 시점 검증 결과 (발급기관마다 다른 표기를 같은 형식으로 정리)
      required: [record_id, status, verified, achievement_name, achievement_description, criteria,
                 issuer_name, issued_at, expires_at, verified_at, checks]
      properties:
        record_id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/CredentialStatus"
        verified:
          type: boolean
          description: 지금 검증을 통과했는지
        achievement_name: { type: string }
        achievement_description: { type: [string, "null"] }
        criteria: { type: [string, "null"], description: 성취 기준 설명 }
        issuer_name: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        verified_at:
          type: [string, "null"]
          format: date-time
          description: 이번에 검증한 시각. 서명 원본이 없어 검증하지 못했으면 null
        checks:
          type: array
          items:
            $ref: "#/components/schemas/VerificationCheck"

    ExcludedEvidence:
      type: object
      required: [record_id, status, reason]
      properties:
        record_id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/CredentialStatus"
        reason:
          type: string
          description: |
            예: no_signed_original(서명 원본 없음), revoked, expired, invalid, verifier_error(검증기 호출 실패).
            포트폴리오 생성·직무 비교는 검증기 장애(설정 누락·연결 실패·시간 초과·5xx·408·429)면 저장하지 않고 502/503으로 끝나므로,
            거기서 verifier_error는 특정 자격증명에 대한 거절(그 밖의 4xx), 3xx 응답(본문과 관계없이), 형식이 맞지 않는 2xx 응답
            (JSON이 아니거나 너무 깊게 중첩된 본문 등)일 때만 나온다.

    EvidenceResponse:
      type: object
      required: [subject_did, mode, evidence, excluded]
      properties:
        subject_did: { type: string }
        mode: { type: string, enum: [strict, labeled] }
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        excluded:
          type: array
          description: "`strict`에서 제외된 자격증명. `labeled`에서는 항상 빈 배열"
          items:
            $ref: "#/components/schemas/ExcludedEvidence"

    # ── 포트폴리오 ────────────────────────────────────────────
    PortfolioCreateRequest:
      type: object
      additionalProperties: false
      required: [title, record_ids, source]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: 한 줄 텍스트 (앞뒤 공백은 잘라 내고, 안쪽의 제어 문자·U+2028·U+2029·NUL은 422)
        target_role:
          type: [string, "null"]
          maxLength: 100
          description: 한 줄 텍스트 (제목과 같은 규칙). 비우면 없음
        record_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
        source:
          type: string
          const: VC_ONLY
          description: 근거 출처. 검증된 자격증명만 쓴다는 표시로 항상 VC_ONLY

    PortfolioUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: 한 줄 텍스트 (생성과 같은 규칙). 공백뿐이거나 null이면 422 `Title must not be blank`
        target_role:
          type: [string, "null"]
          maxLength: 100
          description: 한 줄 텍스트. 비우거나 null이면 희망 직무를 지운다
        status: { type: string, enum: [draft, published] }

    PortfolioSummary:
      type: object
      required: [id, title, target_role, status, credential_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        target_role: { type: [string, "null"] }
        status: { type: string, enum: [draft, published] }
        credential_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Portfolio:
      allOf:
        - $ref: "#/components/schemas/PortfolioSummary"
        - type: object
          required: [source, generator, content_markdown, sections, referenced_record_ids, excluded]
          properties:
            source: { type: string, const: VC_ONLY }
            generator:
              type: string
              description: 본문을 만든 방식. 현재 template (이후 ai)
            content_markdown: { type: string }
            sections:
              type: array
              description: 본문에 들어간 근거 (생성 시점 재검증 결과)
              items:
                $ref: "#/components/schemas/Evidence"
            referenced_record_ids:
              type: array
              items: { type: string, format: uuid }
            excluded:
              type: array
              description: 골랐지만 검증을 통과하지 못해 빠진 자격증명
              items:
                $ref: "#/components/schemas/ExcludedEvidence"

    PortfolioResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          $ref: "#/components/schemas/Portfolio"

    SimpleSuccess:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }

    # ── 선택 공개 ─────────────────────────────────────────────
    ShareCreateRequest:
      type: object
      additionalProperties: false
      required: [record_ids]
      properties:
        record_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
        label:
          type: [string, "null"]
          maxLength: 100
          description: 학생이 알아보기 위한 이름 (예 지원 회사명). 기업용 화면에는 보이지 않는다. NUL·짝 없는 서로게이트는 422
        expires_in_days: { type: integer, minimum: 1, maximum: 90, default: 14 }

    ShareSummary:
      type: object
      required: [id, label, record_ids, expires_at, revoked, view_count, last_viewed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: [string, "null"] }
        record_ids:
          type: array
          items: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        revoked: { type: boolean }
        view_count: { type: integer }
        last_viewed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ShareCreated:
      allOf:
        - $ref: "#/components/schemas/ShareSummary"
        - type: object
          required: [token, share_path]
          properties:
            token:
              type: string
              description: 링크 토큰. 이 응답에서만 볼 수 있다
            share_path:
              type: string
              example: /share/3q2-7wZk...
              description: FE 기업용 조회 화면 경로

    SharedCredential:
      description: |
        기업용 조회의 자격증명 하나. `verified_at`은 실제로 검증기에 물은 시각이라 최근 60초 안에 같은 원본을 확인했으면
        그때 시각이다(최대 60초 전).
      allOf:
        - $ref: "#/components/schemas/Evidence"
        - type: object
          required: [vc_jwt]
          properties:
            vc_jwt:
              type: [string, "null"]
              description: 서명 원본. 기업이 직접 검증할 때 사용 (원본이 없으면 null)

    PublicShare:
      type: object
      required: [holder, credentials, verified_at, expires_at]
      properties:
        holder:
          type: object
          required: [name, did]
          properties:
            name: { type: string }
            did: { type: string }
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/SharedCredential"
        verified_at:
          type: string
          format: date-time
          description: 이번 열람 응답을 만든 시각. 자격증명마다 실제로 검증한 시각은 `credentials[].verified_at` (최대 60초 전)
        expires_at: { type: string, format: date-time }
