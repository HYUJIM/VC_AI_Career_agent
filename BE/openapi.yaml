  /api/v1/shares:
    get:
      tags: [shares]
      summary: 내 공유 링크 목록
      description: |
        토큰(링크 주소)은 만들 때 한 번만 보여 주고 목록에는 포함하지 않는다.
        한 번에 200개까지 돌려준다. 그보다 많으면 유효한(철회·만료되지 않은) 링크를 먼저 고르고 나머지를 최근 생성순으로 채우므로,
        아직 열리는 링크는 목록에서 빠지지 않는다 (순서는 항상 최근 생성순).
      operationId: listShares
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 목록 (최근 생성순, 최대 200개)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShareSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [shares]
      summary: 선택 공개 링크 만들기
      description: |
        학생이 고른 자격증명만 기업에 보여 주는 링크를 만든다. 응답의 `token`은 **이때 한 번만** 내려준다 (서버에는 해시만 저장).
        FE는 `share_path`(예 `/share/{token}`)로 기업용 조회 화면 주소를 만든다.
        유효한(철회·만료되지 않은) 링크는 사용자마다 100개까지다. 이미 100개면 409
        `Share link limit reached. Revoke unused links first.` (쓰지 않는 링크를 철회하면 다시 만들 수 있다).
      operationId: createShare
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareCreateRequest"
            example:
              record_ids: [7c9e6679-7425-40de-944b-e07fc1f90ae7]
              label: 예시회사 백엔드 지원
              expires_in_days: 14
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/ShareCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`record_ids` 중 없거나 본인 것이 아닌 자격증명이 있음 (링크를 만들지 않음)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Credential not found
        "409":
          description: 유효한(철회·만료되지 않은) 공유 링크가 이미 사용자별 상한(100개)만큼 있음 (링크를 만들지 않음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Share link limit reached. Revoke unused links first.
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"

