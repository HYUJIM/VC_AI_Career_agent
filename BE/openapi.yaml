        본문은 수정할 수 없다 (VC_ONLY). 내용을 바꾸려면 자격증명을 골라 새로 만든다.
        제목·희망 직무는 생성과 같은 한 줄 규칙이다(앞뒤 공백을 자른 값 안에 제어 문자·U+2028·U+2029가 있으면 422).
        공백뿐인 제목·`null` 제목은 422 `Title must not be blank`이고, 빈 희망 직무(공백뿐 포함)·`null`은 희망 직무를 지운다.
