  /api/v1/research/job-postings:
    post:
      tags: [career]
      summary: 검토한 공고 반입 (연구자, 새 버전으로 저장)
      description: |
        본문은 `JobPostingInput` (`BE/app/ai_contract/career.py`). 모든 요구사항은 원문의 정확한 위치(start/end)와 인용을 가져야 한다.
        AI 서비스가 주석이 원문과 맞는지("또는" 조건 보존 등) 검사하고, 실패하면 422 `detail`에 규칙 코드를 준다.
        URL을 방문하거나 진위를 인증하지 않는다. `dataset_kind=real`이고 수집 7일 이내인 공고만 비교에 쓰인다.
        `RESEARCHER_USER_IDS`가 아니면 403이고, 연구자인지는 본문 형식 검사보다 먼저 확인한다 (연구자가 아닌 계정은 본문이
        틀려도 422가 아니라 403).
      operationId: importJobPosting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "JobPostingInput" }
      responses:
        "201":
          description: |
            data = JobVersion (posting_id, version_id, content_hash, posting). 연구자 반입 응답이라 저장한 버전 전체
            (`reviewed_by`, `posting.review_note`·`rights_basis`·`raw_text` 포함)를 돌려준다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ResearcherRequired"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          description: |
            형식 오류 또는 주석 규칙 위반 (예 ANNOTATED_SKILL_NOT_MENTIONED_IN_QUOTE). 원문·인용이 NFKC 정규화로 너무 늘어나면
            `TEXT_EXPANDS_TOO_MUCH_WHEN_NORMALIZED` (`TextExpandsTooMuch` 참고). 저장하지 않는다.

