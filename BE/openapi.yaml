      operationId: naverOAuthCallbackPost
      security: []
      requestBody:
        $ref: "#/components/requestBodies/OAuthCallback"
      responses:
        "200":
          $ref: "#/components/responses/OAuthLoggedIn"
        "400":
          $ref: "#/components/responses/OAuthCallbackBadRequest"
        "409":
          $ref: "#/components/responses/OAuthAccountConflict"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyOAuthExchanges"
        "502":
          $ref: "#/components/responses/OAuthProviderError"
        "503":
          $ref: "#/components/responses/OAuthNotConfigured"

  /api/v1/subjects/{did}/careers:
    get:
      tags: [careers]
      summary: 사용자 프로필과 자격증명 목록 조회
      description: |
        DID로 사용자를 찾고, 그 사용자의 자격증명을 `issued_at` 최신순으로 반환한다.
        FE 대시보드와 AI 포트폴리오 빌더가 사용한다.

        현재는 `status`와 관계없이 모든 자격증명을 반환한다. 화면/AI 쪽에서 `status`로 걸러 써야 한다.

        접근: 사용자 토큰은 본인 DID만(남의 DID면 403), 서비스 키(`X-Service-Key`)는 모든 DID 조회 가능. 둘 다 없으면 401.
        사용자 토큰의 계정은 토큰을 확인할 때 이미 있으므로, 404는 사실상 서비스 키로 없는 DID를 조회할 때만 나온다.
        DID 경로에 NUL(`%00`)이 있으면 422 (`loc: ["path", "did"]`).
        응답 형식은 v0.3.0과 같다.
      operationId: getCareersByDid
      security:
        - bearerAuth: []
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Did"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareersResponse"
              example:
                user_profile:
                  id: 3f2b9c1e-6a7d-4e1f-9b2a-1c3d5e7f9a0b
                  did: did:key:z6MkMock1a2b3c4d5e6f
                  email: hong@test.com
                  name: 홍길동
                verified_credentials:
                  - record_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    issuer: 한국산업인력공단 (HRDK)
                    achievement_name: 정보처리기사
                    status: verified
                    issued_at: "2026-09-01T00:00:00+00:00"
                    raw_data: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 해당 DID의 사용자가 없음 (서비스 키로 조회할 때)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: User not found or not verified yet.
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/verify:
    post:
      tags: [verify]
      summary: 자격증명 검증 후 DB 저장
      description: |
        `type`에 따라 DXWorks 검증 API를 호출한다. 사용자 토큰이 필요하다(토큰 없으면 401, 서비스 키는 403).

        - `identity`: VP 토큰을 검증하고 결과만 돌려준다. **사용자를 만들거나 바꾸지 않는다** (v0.4.0 변경).
          **기본은 꺼져 있다**: 이 제품의 화면은 쓰지 않고 회사 API 키가 붙는 호출이라, 서버 설정
          `IDENTITY_VERIFICATION_ENABLED=true`일 때만 받는다. 꺼져 있으면 검증기를 부르지 않고 400
          `Identity verification is disabled`. 켜져 있어도 `token`이 compact JWS 모양(아래)이 아니면 검증기를 부르지 않고
          422 `Invalid token format`.
          검증기가 알려 준 VP 홀더 DID가 토큰 사용자의 DID와 같아야 한다. 다르거나, 홀더 DID가 없거나(빈 값·문자열이 아닌 값 포함)
          누구의 신원인지 정할 수 없으면 403 `Forbidden: presentation holder is not you`이고 클레임을 돌려주지 않는다.
        - `badge`: OB3 VC-JWT를 검증하고 토큰 사용자의 자격증명으로 저장/갱신한다
          (`user_id + source_provider + source_external_id` 기준 upsert).
          - **검증기가 발급자 서명·신뢰를 확인한 배지만 저장한다**: 검증을 통과한 배지(`verified`)와, 서명(`signature_ok`)과
            발급자 신뢰(`issuer_trusted`)가 모두 확인된 폐기·만료 배지(`revoked`/`expired`, `success: false`,
            메시지 `Badge verification failed. Saved with status '<status>'.`).
          - 그 밖의 토큰(서명·발급자 신뢰를 확인하지 못한 `invalid` 등)과 해석할 수 없거나 수신자를 알 수 없는 토큰
            (NaN·Infinity·범위를 넘는 숫자, NUL·짝 없는 서로게이트, dict·list가 64단계(최상위 객체 = 1단계)보다 깊게 중첩된
            페이로드 포함. 검증기가 확인한 토큰이어도 같음)은 저장하지 않고
            200 `success: false`, 메시지 `Badge verification failed.`, `data.record_id: null`로 답한다. 본문의 자격증명 ID·수신자를
            믿을 수 없으므로 DB를 조회하지 않고(아래 403·409도 나오지 않음), 이미 저장된 같은 자격증명의 레코드도 바꾸지 않는다.
          - 서명된 원본 VC-JWT(`raw_token`)와 점검 항목 8개(`verification_checks`)를 함께 저장한다.
          - 저장할 배지의 수신자(`credentialSubject.id`)가 토큰 사용자 DID와 다르면 403
            `Forbidden: credential was issued to a different DID` (가입하지 않은 DID도 403. 예전의 임시 사용자 자동 생성은 제거).
          - 같은 자격증명이 이미 다른 사용자에게 등록되어 있으면 409.
          - 배지 이름은 255자까지 잘라 저장하고, 255자를 넘거나 저장할 수 없는 문자가 든 자격증명 ID는 같은 ID면 같은 값이 되는
            `sha256:<64 hex>`로 바꿔 저장한다. 날짜는 0001-01-02 ~ 9999-12-30 UTC 안으로 맞춘다.

        검증 실패는 HTTP 200에 `success: false`로 응답한다. `token`은 256 KiB(262,144자)까지이고, 넘거나 NUL이 있으면
        검증기를 부르지 않고 422.

        `token`은 compact JWS(JWT) 모양이어야 검증기로 보낸다 (서명·내용은 보지 않는다).
        - ASCII 문자뿐이고, 점(`.`)으로 나뉜 비어 있지 않은 base64url 조각이 정확히 셋이다. 조각 끝의 base64 패딩 `=`는
          조각마다 둘까지 받는다.
        - 첫 조각(머리말)은 UTF-8 JSON 객체이고 같은 키가 두 번 나오지 않으며, `alg`가 `[A-Za-z0-9_-]` 1~32자의 문자열이고
          `none`(대소문자 무시)이 아니다.
        - SD-JWT(`<jws>~<disclosure>~...~[<kb-jwt>]`)도 받는다: 첫 부분이 위 규칙을 지키고, 공개 항목(disclosure)은 비어 있지 않은
          base64url 문자열(패딩 없음)이며, 마지막 `~` 뒤는 비어 있거나 조각 셋의 키 바인딩 JWT다.
        아니면 검증기를 부르지 않고
        `badge`는 200 `success: false`, 메시지 `Badge verification failed.`, `data.record_id: null`(`signature` 점검 `fail`),
        `identity`는 422 `Invalid token format`으로 답한다. `badge`를 모양 때문에 거절하면 서버 감사 로그에
        `event=verify_shape_refused user=<사용자 UUID>` 한 줄이 남는다 (응답만으로는 검증기가 거절한 토큰과 구분되지 않는다).

        검증기를 부르는 요청은 호출 몫 1을 쓴다. 몫이 모자라면 검증기를 부르지 않고 429 + `Retry-After` (info "응답/에러 규칙").
        `badge`에는 한도가 하나 더 있다: 검증기까지 가서 그 토큰이 거절된 요청은 호출자마다 10분에 10번까지다
        (서버 프로세스마다 셈). 저장하지 않는 `success: false`(해석할 수 없는 원본, 수신자를 알 수 없는 배지, 검증기가 발급자
        서명·신뢰를 확인하지 못한 토큰), 그 토큰 하나에 대한 검증기 오류(502), 다른 DID에 발급된 배지(403), 다른 사용자가 등록한
        배지(409), 검증기에 묻는 동안 끊긴 요청이 여기에 남는다. 통과한 검증·저장된 배지(폐기·만료 상태로 저장돼 `success: false`인
        것 포함)·검증기 장애(502/503)·호출 몫 부족(429)·검증기를 부르기 전에 끝난 요청(모양 검사에 걸린 토큰 포함)·검증기가 답한
        뒤 서버 쪽 문제로 끝난 요청(DB가 바빠 503 등)은 남지 않는다. 창이 차면 호출 몫을 쓰지 않고
        검증기도 부르지 않은 채 같은 429(`Too many verification requests. Try again later.`) + `Retry-After`(가장 오래된 기록이
        창을 벗어날 때까지의 초)로 답한다. 자리는 검증기를 부르기 전에 잡으므로, 한 호출자의 배지 검증이 동시에 10개 넘게 진행
        중이면 11번째부터는 통과할 토큰이어도 429다.
      operationId: verifyCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
            examples:
              badge:
                summary: 배지 검증 (mock-issuer/issue로 받은 vcJwt)
                value:
                  type: badge
                  token: eyJhbGciOiJFZERTQSJ9...
              identity:
                summary: 신원 VP 검증
                value:
                  type: identity
                  token: eyJhbGciOiJFZERTQSJ9...
      responses:
        "200":
          description: |
            요청 처리 완료. 검증 성공 여부는 `success`로 판단한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
              examples:
                badgeVerified:
                  summary: 배지 검증 성공
                  value:
                    success: true
                    message: Badge verified and saved.
                    data:
                      record_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      status: verified
                      valid: true
                      achievement_name: 테스트 수료 배지
                      issuer_name: 예시대학교
                      issuer_trusted: true
                      recipient_did: did:key:z6MkMock1a2b3c4d5e6f
                      issued_at: "2026-09-01T00:00:00+00:00"
                      expires_at: "2026-10-01T00:00:00+00:00"
                      checks:
                        - { name: schema, result: pass, detail: null }
                        - { name: recipient, result: pass, detail: "did:key:z6MkMock1a2b3c4d5e6f" }
                        - { name: signature, result: pass, detail: null }
                        - { name: issuer_trust, result: pass, detail: null }
                        - { name: revocation, result: pass, detail: VALID }
                        - { name: expiration, result: pass, detail: "2026-10-01T00:00:00+00:00" }
                        - { name: did_resolution, result: skip, detail: 검증기 내부에서 처리 }
                        - { name: anchor_match, result: skip, detail: 원장 앵커링 대조 미지원 }
                badgeRevoked:
                  summary: 배지 검증 실패 (발급자 서명·신뢰가 확인된 폐기 배지, 상태와 함께 저장됨)
                  value:
                    success: false
                    message: Badge verification failed. Saved with status 'revoked'.
                    data:
                      record_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      status: revoked
                      valid: false
                      achievement_name: 테스트 수료 배지
                      issuer_name: 예시대학교
                      issuer_trusted: true
                      recipient_did: did:key:z6MkMock1a2b3c4d5e6f
                      issued_at: "2026-09-01T00:00:00+00:00"
                      expires_at: null
                      checks:
                        - { name: revocation, result: fail, detail: REVOKED }
                badgeNotSaved:
                  summary: 배지 검증 실패 (발급자 서명·신뢰를 확인하지 못함, 저장하지 않음)
                  value:
                    success: false
                    message: Badge verification failed.
                    data:
                      record_id: null
                      status: invalid
                      valid: false
                      achievement_name: 테스트 수료 배지
                      issuer_name: 예시대학교
                      issuer_trusted: false
                      recipient_did: did:key:z6MkMock1a2b3c4d5e6f
                      issued_at: "2026-09-01T00:00:00+00:00"
                      expires_at: null
                      checks:
                        - { name: signature, result: fail, detail: null }
                        - { name: issuer_trust, result: fail, detail: null }
                identityVerified:
                  summary: 신원 검증 성공
                  value:
                    success: true
                    message: Identity verified.
                    data:
                      verified: true
                      holder_did: did:key:z6MkMock1a2b3c4d5e6f
                      claims: { name: 홍길동 }
        "400":
          description: "지원하지 않는 `type`, 또는 `type: identity`인데 서버에서 신원 검증을 켜지 않음 (기본값)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidType:
                  value: { detail: 'Invalid type. Use "identity" or "badge"' }
                identityDisabled:
                  value: { detail: Identity verification is disabled }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 발급자가 확인된 배지의 수신자가 본인이 아님, VP 홀더가 본인이 아님, 또는 서비스 키로 호출함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                otherRecipient:
                  value: { detail: "Forbidden: credential was issued to a different DID" }
                otherHolder:
                  value: { detail: "Forbidden: presentation holder is not you" }
                serviceKey:
                  value: { detail: Service key cannot call write APIs }
        "409":
          description: 같은 자격증명이 이미 다른 사용자에게 등록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Credential already registered to another user
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          description: |
            요청 검증 실패 (`ValidationError` 참고), 또는 `type: identity`의 `token`이 compact JWS 모양이
            아님 (`{ "detail": "Invalid token format" }`, 검증기를 부르지 않는다)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Invalid token format
        "429":
          $ref: "#/components/responses/TooManyVerifications"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/mock-issuer/issue:
    post:
      tags: [mock-issuer]
      summary: 모의 배지 발급 (테스트용)
      description: |
        DXWorks OB3 발급 API로 배지를 발급하고 서명된 VC-JWT를 돌려준다.
        FE 발급 화면은 이 `vcJwt`를 그대로 `POST /api/v1/verify` (`type: badge`)에 넘긴다.
        서버 `.env`의 `DXWORKS_API_HOST`(`https://` 주소), `DXWORKS_API_KEY`가 필요하다 (없으면 503 `PROVIDER_NOT_CONFIGURED`).

        회사 API 키로 발급하므로 다음 순서로 검사한다.
        1. 로그인 사용자 토큰이 필요하다 (토큰 없음·서비스 키·무효 토큰은 401).
        2. 서버 설정 `MOCK_ISSUER_ENABLED`가 꺼져 있으면 404 `Mock issuer is disabled`. 비우면 `APP_ENV=development`에서만 켜진다
           (운영 이미지 기본값 `APP_ENV=production`에서는 `true`를 넣어야 켜짐).
        3. `templateId`(앞뒤 공백 제거, 비우면 `DXWORKS_BADGE_TEMPLATE_ID`)가 비어 있으면(기본 템플릿도 없음) 503 `PROVIDER_NOT_CONFIGURED`.
           `DXWORKS_BADGE_TEMPLATE_ID`나 서버 설정 `MOCK_ISSUER_TEMPLATE_IDS`(쉼표 구분)에 없는 값이면 협력사 API를 부르지 않고
           403 `Template not allowed`.
        4. `holderDid`가 토큰 사용자 본인 DID가 아니면 403 `Forbidden: can only issue to your own DID`.
        5. 사용자별로 최근 24시간 동안의 발급이 `MOCK_ISSUER_DAILY_LIMIT`건(기본 10)에 닿았으면 협력사 API를 부르지 않고 429
           `Mock issuance limit reached; try again later`, 모든 사용자를 합친 발급(최근 24시간의 성공한 발급과, 상태와 관계없이
           최근 10분 안에 만든 기록)이 `MOCK_ISSUER_GLOBAL_DAILY_LIMIT`건(기본 200)에 닿았으면 429
           `Mock issuance service limit reached; try again later.`다
           (둘 다 `Retry-After` 헤더 없음. 두 한도가 함께 찼으면 앞의 문구). 사용자 자신의 한도와 전체 한도를 구분해 답하는 것으로,
           FE는 뒤의 문구를 "전체 모의 발급 한도" 안내로 보여 준다. 발급 전에 자리를 잡아 동시 요청·여러 태스크에서도
           넘지 않고, 협력사가 거절·실패로 답했거나 요청이 닿지 않은 발급(5xx·4xx·3xx 응답, 연결 실패, 설정 누락: 502/503)은
           세지 않는다(잡아 둔 자리를 지우는 DB 작업까지 실패하면 그 502/503은 그대로 돌려주되 그 자리는 해시 없는 기록으로 남는다).
           요청이 협력사에 닿았을 수 있는데 결과를 모르는 실패(응답 대기 중 시간 초과·끊김, `jwt`가 없거나 읽을 수 없는 2xx: 502)는
           배지가 이미 발급됐을 수 있으므로 자리를 지우지 않고 한도에 센다. 해시가 없는 기록은 사용자별 한도에는 24시간 동안 세고,
           전체 한도에는 만든 뒤 10분(진행 중 창: 발급 요청 하나가 걸릴 수 있는 가장 긴 시간보다 길다) 동안만 센다. 그래서 응답 대기
           시간 초과로 이어진 장애가 전체 한도를 채워도 협력사가 돌아온 뒤 길어야 10분에 1분쯤 더 지나면 다시 발급된다.
        6. 위와 별도로 서버 프로세스마다 메모리에서 세는 것이 둘 있고, 5번의 자리를 잡기 전에 이 순서로 먼저 확인한다.
           - 사용자별 시도 한도: 협력사 호출을 시도한 발급 요청은 성공·실패(연결 실패 포함)를 가리지 않고 사용자별로 24시간에
             `max(30, 3 × MOCK_ISSUER_DAILY_LIMIT)`번까지만 받는다. 넘으면 협력사 API를 부르지 않고 사용자 한도 문구의 429다.
           - 실패 차단기: 협력사 호출을 시도했는데 성공하지 못한 발급(협력사의 거절·5xx, 연결 실패, 결과를 모르는 실패)이
             모든 사용자를 합쳐 24시간에 `MOCK_ISSUER_GLOBAL_DAILY_LIMIT`번 쌓이면 발급을 멈춘다 (협력사가 실패하거나 우리를
             제한하는 동안 여러 계정이 부르는 양을 묶는다). 멈춘 동안에는 60초에 한 건만 협력사로 보내 보고, 그 밖의 요청은
             협력사 API를 부르지 않고 429 `Mock issuance is paused after repeated failures. Try again shortly.` +
             `Retry-After`(다음에 보내 볼 수 있을 때까지의 초, 1~60)다 (사용자별 시도로 세지 않는다). 보내 본 한 건이 성공하면
             실패 기록을 모두 지워 바로 다시 연다 (서버 재시작이나 24시간을 기다리지 않는다).
             차단기는 협력사를 부르기 전에 자리를 잡으므로 진행 중인 요청도 함께 센다. 실패로 끝난 발급 없이 진행 중인 요청만으로
             한도가 찼으면(한도만큼의 요청이 한꺼번에 진행 중) 멈춘 것이 아니므로 탐침 없이 429
             `Mock issuance service limit reached; try again later.`다 (`Retry-After` 없음, 사용자별 시도로 세지 않는다).
        발급에 성공하면 사용자·템플릿 ID·VC-JWT의 SHA-256만 기록한다(VC-JWT 원문은 저장하지 않음). 협력사가 발급한 뒤 해시 기록이
        DB 오류로 실패해도 배지는 돌려주고(200), 그 발급 기록은 해시 없이(`token_sha256` NULL) 남는다(사용자별 한도에는 24시간,
        전체 한도에는 10분 동안 센다). 두 경우 모두 BE 로그에
        발급 기록 ID와 그 DB 작업이 낸 예외의 클래스 이름(예: `OperationalError`)만 든 경고가 한 줄 남는다(토큰·DID·예외 메시지는
        남기지 않는다).
      operationId: issueMockBadge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueMockBadgeRequest"
      responses:
        "200":
          description: 발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMockBadgeResponse"
              example:
                success: true
                message: Successfully issued a mock badge
                vcJwt: eyJhbGciOiJFZERTQSJ9...
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 허용되지 않은 템플릿, 또는 본인 DID가 아닌 `holderDid`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                templateNotAllowed:
                  value: { detail: Template not allowed }
                notYourDid:
                  value: { detail: "Forbidden: can only issue to your own DID" }
        "404":
          description: 모의 발급 비활성화, 또는 토큰을 확인한 직후 계정이 삭제되어 `holderDid`로 가입한 사용자가 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                disabled:
                  value: { detail: Mock issuer is disabled }
                notRegistered:
                  value: { detail: Holder DID is not registered }
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: |
            모의 발급 한도 초과, 또는 협력사 실패가 이어져 발급을 잠시 멈춤. 협력사 API는 호출하지 않는다. `detail`로 구분한다.
            - `Mock issuance limit reached; try again later`: 그 사용자의 한도. 사용자별 24시간 발급 한도
              (`MOCK_ISSUER_DAILY_LIMIT`, 기본 10) 또는 사용자별 24시간 시도 한도(`max(30, 3 × MOCK_ISSUER_DAILY_LIMIT)`번).
            - `Mock issuance service limit reached; try again later.`: 전체 한도. 모든 사용자를 합친 24시간 발급 한도
              (`MOCK_ISSUER_GLOBAL_DAILY_LIMIT`, 기본 200)에 닿았을 때, 또는 실패 차단기가 진행 중인 요청만으로 찼을 때
              (실패한 것 없이 한도만큼의 요청이 한꺼번에 진행 중). 발급을 적게 한 사용자도 받을 수 있다.
            - `Mock issuance is paused after repeated failures. Try again shortly.`: 서버 프로세스의 실패 차단기가 발급을
              멈춘 동안 (협력사까지 간 실패와 진행 중인 요청이 24시간에 `MOCK_ISSUER_GLOBAL_DAILY_LIMIT`번 쌓였고 그 가운데
              실패로 끝난 발급이 있음). 한도에 닿은 것이 아니라 협력사가 돌아오면 풀리는 상태이고, 이 응답에만 `Retry-After`
              헤더가 붙는다. FE가 보여 주는 문구:
              "발급 서버 오류가 이어져 모의 발급을 잠시 멈췄습니다. 1분쯤 뒤에 다시 시도해주세요."
          headers:
            Retry-After:
              description: (발급을 멈춘 동안의 응답에만) 다음 요청 하나를 협력사로 보내 볼 수 있을 때까지의 초 (1~60)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userLimit:
                  summary: 그 사용자의 한도
                  value: { detail: "Mock issuance limit reached; try again later" }
                serviceLimit:
                  summary: 전체 한도
                  value: { detail: "Mock issuance service limit reached; try again later." }
                paused:
                  summary: 협력사 실패가 이어져 발급을 잠시 멈춤 (Retry-After 있음)
                  value: { detail: "Mock issuance is paused after repeated failures. Try again shortly." }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/v1/credentials/{record_id}/reverify:
    post:
      tags: [reverify]
      summary: 자격증명 하나를 지금 다시 검증
      description: |
        저장된 **서명 원본(VC-JWT)**을 검증기에 다시 보내 상태를 갱신한다 (폐기·만료 반영).
        서명 원본이 없는 자격증명(시드 데이터 등)은 `status: unverifiable`로 응답하고 DB는 바꾸지 않는다.
        본인 자격증명만 가능하며 로그인 토큰이 필요하다.
        검증기 호출 몫 1을 쓴다(서명 원본이 없으면 쓰지 않음). 모자라면 검증기를 부르지 않고 429 + `Retry-After`.

        검증기가 이 서명 원본 하나만 확인하지 못한 경우(400·404·422 같은 거절, 형식이 틀린 2xx)는 이 자격증명의 결과다:
        근거 조회·포트폴리오와 같은 분류로 200 `success: false`, `message: "Re-verification failed: verifier_error"`,
        `data.status: unverifiable`로 답하고 저장된 상태는 바꾸지 않는다 (v0.8.0 변경. 예전에는 502). 502/503은 검증기 장애
        (설정 누락·연결 실패·시간 초과·5xx·408·429·401·403·3xx)일 때만이다.
        `message`는 통과하면 `Credential re-verified.`, 서명 원본이 없으면 `No signed original to re-verify.`, 그 밖에는
        `Re-verification failed: <사유>`다 (사유 예: `revoked`, `expired`, `verifier_error`).
      operationId: reverifyCredential
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: |
            재검증 완료. 통과 여부는 `success`(= `data.status == verified`). 검증기가 이 자격증명만 확인하지 못한 경우도
            200이다 (`success: false`, 저장된 상태는 그대로).
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Evidence"
              examples:
                verifierError:
                  summary: 검증기가 이 자격증명만 확인하지 못함 (저장된 상태는 바뀌지 않음)
                  value:
                    success: false
                    message: "Re-verification failed: verifier_error"
                    data:
                      record_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      status: unverifiable
                      verified: false
                      achievement_name: 테스트 수료 배지
                      achievement_description: null
                      criteria: null
                      issuer_name: 예시대학교
                      issued_at: "2026-09-01T00:00:00+00:00"
                      expires_at: null
                      verified_at: null
                      checks:
                        - { name: signature, result: skip, detail: 검증기 호출 실패 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyVerifications"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/v1/subjects/{did}/evidence:
    get:
      tags: [reverify]
      summary: 근거 조회 (요청 시점 재검증)
      description: |
        논문 RAG-VC의 "실행 시점 재검증". DB에 저장된 상태값을 믿지 않고, 요청할 때마다 서명 원본을 다시 검증한 뒤
        **서명 원본 안의 본문**에서 근거를 뽑아 돌려준다.

        - `mode=strict`(기본, 논문 System VC): 지금 검증을 통과한 것만 `evidence`에 넣고 나머지는 `excluded`에 사유와 함께 둔다.
        - `mode=labeled`(논문 System VC-F): 모두 `evidence`에 넣되 `status`/`verified`로 표시한다.
        - `record_id`를 여러 번 주면 그 자격증명만 대상으로 한다 (사전 고정 후보).

        접근: 사용자 토큰은 본인 DID만(남의 DID면 403), 서비스 키(`X-Service-Key`)는 모든 DID. 둘 다 없으면 401.
        DID 경로에 NUL(`%00`)이 있으면 422 (`loc: ["path", "did"]`).

        대상 자격증명 중 서명 원본이 있는 수만큼 검증기 호출 몫을 한꺼번에 쓴다(서비스 키는 누구의 DID를 읽든 한 몫을 함께 쓴다).
        모자라면 검증기를 하나도 부르지 않고 429 + `Retry-After`. 검증기 호출이 실패한 자격증명은 200 응답 안에서
        `status: unverifiable`, 사유 `verifier_error`로 표시하고(DB 상태는 바꾸지 않음), 검증기 장애가 한 번 확인되면 남은
        자격증명은 부르지 않고 같은 사유로 표시한다.
      operationId: getEvidence
      security:
        - bearerAuth: []
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Did"
        - name: mode
          in: query
          schema: { type: string, enum: [strict, labeled], default: strict }
        - name: record_id
          in: query
          description: 대상 자격증명 ID (여러 번 지정 가능). 생략하면 사용자의 전체 자격증명
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: true
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyVerifications"

  /api/v1/portfolios:
    get:
      tags: [portfolios]
      summary: 내 포트폴리오 목록
      operationId: listPortfolios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 목록 (최근 수정순, 최대 200개)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortfolioSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [portfolios]
      summary: 포트폴리오 생성 (VC_ONLY)
      description: |
        **자유 텍스트 본문을 받지 않는다** (허위 이력 차단, 계획서 "Security by Default").
        요청은 자격증명 ID 목록과 `source: VC_ONLY`만 받고, 정의되지 않은 필드가 있으면 422로 거절한다.

        서버는 고른 자격증명을 **지금 다시 검증**해서 통과한 것만 본문에 넣는다. 통과하지 못한 것은 `excluded`에 사유와 함께 둔다.
        통과한 것이 하나도 없으면 422. 재검증 중 검증기 장애가 나면 저장하지 않고 502/503 (고른 자격증명의 서명 원본이 둘 이상인데
        모두 검증기 오류로 끝난 경우도 502). 고른 자격증명 중 서명 원본이 있는 수만큼 검증기 호출 몫을 쓰고, 모자라면 검증기를
        부르지 않고 429 + `Retry-After`(아무것도 만들지 않음).
        포트폴리오는 사용자마다 100개까지다. 이미 100개면 검증기를 부르지 않고 409 `Portfolio limit reached.`
        (쓰지 않는 것을 지우면 다시 만들 수 있다).
        본문은 현재 템플릿으로 만든다 (`generator: template`). 이후 AI 생성으로 바뀌어도 요청 형식은 같다.
        제목·희망 직무는 본문 머리말에 한 줄로 들어가므로, 앞뒤 공백·줄바꿈을 자른 값 안에 줄바꿈·탭 같은 제어 문자나
        U+2028·U+2029가 있으면 422 `Value error, must be a single line without control characters`다 (NUL도 422).
      operationId: createPortfolio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioCreateRequest"
            example:
              title: 백엔드 개발자 지원용
              target_role: 백엔드 개발자
              record_ids: [7c9e6679-7425-40de-944b-e07fc1f90ae7]
              source: VC_ONLY
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`record_ids` 중 없거나 본인 것이 아닌 자격증명이 있음 (다시 검증하지 않고 아무것도 만들지 않음)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Credential not found
        "409":
          description: 포트폴리오가 이미 사용자별 상한(100개)만큼 있음 (아무것도 만들지 않음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Portfolio limit reached.
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          description: |
            요청 형식 오류(자유 텍스트 필드 포함, source가 VC_ONLY가 아님, 제목·희망 직무가 한 줄이 아님 등) 또는
            검증을 통과한 자격증명이 없음
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                detail: No verified credentials selected
