# 앱 서비스 (HTTP 모드와 HTTPS 모드의 server 블록이 함께 include). FE는 SPA, /api/*는 backend로.

root /usr/share/nginx/html;

# 변수로 두면 요청마다 Docker DNS로 다시 찾는다 (backend를 다시 만들어도 nginx를 재시작하지 않아도 됨).
set $vc_backend http://backend:3000;

# nginx가 낸 429(IP별 제한)만 바꾼다. BE가 낸 429는 그대로 지나간다 (proxy_intercept_errors 꺼짐).
error_page 429 = @vc_rate_limited;

location @vc_rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    return 429 '{"detail":"Too many attempts. Try again later."}\n';
}

location ^~ /api/ {
    limit_req zone=vc_slow burst=20 nodelay;
    limit_req zone=vc_fast burst=60 nodelay;

    proxy_pass $vc_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # 클라이언트가 보낸 X-Forwarded-For를 이어 붙이지 않고 실제 접속 IP로 덮어쓴다.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # LLM 학습 계획은 BE가 AI를 최대 90초, FE는 120초까지 기다린다. DXWorks 호출 하나는 최악 60초.
    proxy_connect_timeout 5s;
    proxy_send_timeout 125s;
    proxy_read_timeout 125s;
    # 응답이 늦어도 다시 보내지 않는다 (GET도 DXWorks를 부를 수 있음).
    proxy_next_upstream off;
    # 보안 헤더·Cache-Control: no-store는 BE가 모든 응답에 직접 붙인다 (여기서는 add_header를 쓰지 않음).
}

# 인증서 발급·갱신(certbot --webroot)용. HTTPS 모드에서도 80에서 받는다.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}

location = /index.html {
    include /etc/nginx/vc/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

# 해시가 붙은 빌드 산출물: 1년 캐시. 캐시 헤더는 성공 응답에만 붙인다(always 없음): 404를 캐시하지 않게.
location ^~ /assets/ {
    include /etc/nginx/vc/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# 그 밖에 마지막 경로 조각에 점이 있는 요청(favicon.svg 등)은 파일로만 찾는다 (없으면 404, index.html로 바꾸지 않음).
location ~ /[^/]*\.[^/]*$ {
    include /etc/nginx/vc/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

# SPA 경로(/dashboard, /auth/google/callback, /share/<token> 등)는 모두 index.html(200)로.
location / {
    include /etc/nginx/vc/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}
