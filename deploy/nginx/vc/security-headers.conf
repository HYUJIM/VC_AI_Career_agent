# FE 정적 응답의 보안 헤더 (API 응답에는 BE가 직접 붙인다).
# nginx는 location에 add_header가 하나라도 있으면 바깥 것을 물려받지 않으므로 정적 location마다 이 파일을 include한다.
# Pretendard 웹폰트를 jsDelivr에서 받으므로 style-src·font-src에 https://cdn.jsdelivr.net이 있다 (FE/src/main.tsx).
add_header Strict-Transport-Security $vc_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
