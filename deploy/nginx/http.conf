# http 블록에 들어가는 공통 설정 (이미지의 /etc/nginx/conf.d/00-vc-http.conf).

server_tokens off;

# BE가 경로별 상한(기본 64 KiB, 연구자 반입 2 MiB)으로 다시 막는다. 여기서는 그보다 조금 크게만 둔다.
client_max_body_size 3m;

# Docker 내장 DNS. backend 컨테이너가 다시 만들어져 IP가 바뀌어도 따라간다 (proxy_pass에 변수를 씀).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# 정적 파일만 압축한다 (API 응답은 압축하지 않음: 토큰이 담긴 응답에 BREACH류 공격 여지를 두지 않음).
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# HTTPS로 서비스할 때만 HSTS를 보낸다 (HTTP 모드에서는 빈 값이라 헤더가 붙지 않음).
map $scheme $vc_hsts {
    https   "max-age=31536000";
    default "";
}

# ---------------------------------------------------------------------------------------------
# IP별 요청 제한 (예전 AWS WAF 속도 기반 규칙을 옮긴 것). nginx가 맨 앞이므로 $binary_remote_addr가 실제 접속 IP다.
# 키가 빈 요청은 세지 않는다. $uri는 %인코딩을 풀고 정규화한 경로라 /api/v1/users/%6Cogin도 로그인으로 센다.
# 값은 시작 값이다: 강의실 하나가 NAT IP 하나로 함께 써도 로그인·가입·목록 조회는 넘지 않게 잡았다.
# 넘으면 429 {"detail":"Too many attempts. Try again later."} + Retry-After (vc/app.conf의 @vc_rate_limited).
# ---------------------------------------------------------------------------------------------

# 분당 20번 (5분에 약 100번 + 처음 몰아서 20번). 요청 하나가 DXWorks·AI·외부 LLM을 여러 번 부르거나 계정을 만드는 경로.
map "$request_method:$uri" $vc_rl_slow_key {
    default "";
    "POST:/api/v1/users/register"                              "$binary_remote_addr register";
    "POST:/api/v1/verify"                                      "$binary_remote_addr verify";
    "POST:/api/v1/portfolios"                                  "$binary_remote_addr portfolios";
    "POST:/api/v1/career-analyses"                             "$binary_remote_addr career-analyses";
    "POST:/api/v1/curricula"                                   "$binary_remote_addr curricula";
    "POST:/api/mock-issuer/issue"                              "$binary_remote_addr mock-issue";
    "~^GET:/api/v1/subjects/[^/]+/evidence$"                   "$binary_remote_addr evidence";
    "~^POST:/api/v1/users/oauth/(?<vc_cb>google|github|naver)/callback$" "$binary_remote_addr callback-$vc_cb";
    "~^POST:/api/v1/research/"                                 "$binary_remote_addr research";
}

# 분당 60번 (5분에 약 300번 + 처음 몰아서 60번).
map "$request_method:$uri" $vc_rl_fast_key {
    default "";
    "POST:/api/v1/users/login"                                 "$binary_remote_addr login";
    "GET:/api/v1/job-postings"                                 "$binary_remote_addr job-postings";
    "GET:/api/v1/learning-resources"                           "$binary_remote_addr learning-resources";
    "~^GET:/api/v1/public/shares/"                             "$binary_remote_addr public-shares";
    "~^POST:/api/v1/credentials/[^/]+/reverify$"               "$binary_remote_addr reverify";
    "~^GET:/api/v1/users/oauth/(?<vc_az>google|github|naver)/authorize$" "$binary_remote_addr authorize-$vc_az";
}

limit_req_zone $vc_rl_slow_key zone=vc_slow:10m rate=20r/m;
limit_req_zone $vc_rl_fast_key zone=vc_fast:10m rate=60r/m;
limit_req_status 429;
limit_req_log_level warn;
