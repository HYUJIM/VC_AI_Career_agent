# 운영 DB 접속 규칙 (postgres/start.sh가 hba_file로 지정).
# - local: 컨테이너 안 유닉스 소켓만 (docker compose exec postgres psql, 백업, 상태 확인). 서버의 root만 쓸 수 있다.
# - hostssl: Docker 네트워크의 TCP 접속은 TLS + 비밀번호(SCRAM)만 받는다. TLS 없는 TCP 접속은 맞는 줄이 없어 거부된다.
# TYPE   DATABASE  USER  ADDRESS  METHOD
local    all       all            trust
hostssl  all       all   all      scram-sha-256
