name: tests

on:
  pull_request:
  push:
    branches: [main]

# GITHUB_TOKEN은 저장소 읽기만 허용한다 (테스트·빌드는 GitHub에 쓰지 않는다).
# 체크아웃은 persist-credentials: false로 토큰을 git 설정에 남기지 않는다.
# 액션은 태그 대신 커밋 SHA로 고정한다 (# 뒤는 그 SHA의 버전). .github/dependabot.yml이 갱신 PR을 연다.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  be:
    name: BE (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        # BE/docker-compose.yml과 같은 고정 태그 (pgvector 0.8.7, PostgreSQL 16, Debian bookworm)
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: BE
    env:
      # tests/conftest.py가 이 서버에 테스트 전용 DB를 만들고 마이그레이션 실행기(app.migrate)로 스키마·시드·마이그레이션을 적용한다.
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BE/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ai:
    name: AI (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      # GPU 모델 패키지(requirements-gpu.txt)는 설치하지 않는다. GPU 없이 도는 테스트만 실행한다.
      # pytest는 실행용 requirements.txt가 아니라 requirements-dev.txt에 있다.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # BE/app/ai_contract가 ai/src/career/contracts와 바이트 단위로 같은지 확인한다.
      - run: python scripts/sync_contract_to_be.py --check

  research-vc:
    name: research-vc (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-vc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: research-vc/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  fe:
    name: FE (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run lint
      # build = tsc -b(타입체크) + vite build
      - run: npm run build
      # 운영 번들(dist)이 외부 출처의 스크립트를 불러오지 않는지 본다. 외부 스크립트는 이 사이트 권한으로 실행되어
      # localStorage의 로그인 토큰·비밀번호 입력을 읽을 수 있다. Figma 캡처 스크립트(mcp.figma.com)는
      # vite.config.ts의 개발 서버 전용 플러그인이 npm run dev에서만 넣는다.
      # Pretendard 웹폰트 <link>(cdn.jsdelivr.net 스타일시트)는 <script>가 아니므로 이 검사 대상이 아니다.
      - name: Check dist has no third-party scripts
        run: |
          test -f dist/index.html
          if grep -rliF 'mcp.figma.com' dist; then
            echo "::error::운영 번들(dist)에 Figma 캡처 스크립트(mcp.figma.com)가 들어 있습니다 (위 파일 참고)."
            exit 1
          fi
          # 여러 줄에 걸친 태그도 보도록 줄바꿈을 공백으로 바꾼 뒤 <script> 태그만 뽑아,
          # src가 http:, https: 또는 //(프로토콜 생략)로 시작하는 태그를 찾는다.
          external=$(tr '\r\n\t' '   ' < dist/index.html | grep -oiE '<script[^>]*>' \
            | grep -iE "src[[:space:]]*=[[:space:]]*[\"']?[[:space:]]*(https?:|//)" || true)
          if [ -n "$external" ]; then
            echo "$external"
            echo "::error::dist/index.html이 외부 출처의 스크립트(<script src>)를 불러옵니다 (위 태그 참고)."
            exit 1
          fi
      # 개발 서버 전용 운영자 안내(로컬 BE 주소·서버 설정 이름·공유 형식 이름)가 import.meta.env.DEV 분기 밖으로 새어
      # 운영 번들에 들어가지 않았는지 본다. 압축된 번들 한 줄 전체가 아니라 찾은 문자열만 출력한다(-o).
      - name: Check dist has no dev-only hints
        run: |
          test -d dist
          if grep -rnoE 'localhost:3000|AI_SERVICE_(TOKEN|URL)|DXWORKS_|ai_contract' dist; then
            echo "::error::운영 번들(dist)에 개발 전용 안내가 있습니다. import.meta.env.DEV 분기 안으로 옮기세요 (위 위치 참고)."
            exit 1
          fi

  docker:
    name: Docker (image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 배포에 쓰는 운영 이미지를 그대로 만든다 (push 없음).
      - run: docker build -t vc-be:ci BE
      - run: docker build -t vc-ai:ci ai
      # 이미지만으로(바인드 마운트·DB·AI 없이) 앱이 import 되는지 본다.
      # BE 이미지 기본값 APP_ENV=production은 비밀값이 없으면 시작을 거부하므로 development로 확인한다.
      - run: docker run --rm -e APP_ENV=development vc-be:ci python -c "import main"
      - run: docker run --rm vc-ai:ci python -c "import src.server.app"
      # AWS 일회성 태스크로 쓰는 마이그레이션 실행기(python -m app.migrate)가 이미지 안에서 뜨는지 (DB 접속 없음)
      - run: docker run --rm vc-be:ci python -m app.migrate --help
      # Compose 파일 문법·서비스 참조 검사. env_file(BE/.env)은 저장소에 없으므로 예시 파일을 복사해 쓴다
      # (러너의 Compose v2는 --no-env-resolution을 줘도 .env 파일이 있어야 한다).
      - run: cp BE/.env.example BE/.env && docker compose -f BE/docker-compose.yml config -q
