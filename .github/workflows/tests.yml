name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  be:
    name: BE (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: BE
    env:
      # tests/conftest.py가 이 서버에 테스트 전용 DB를 만들고 스키마·시드·마이그레이션을 적용한다.
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BE/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ai:
    name: AI (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      # GPU 모델 패키지(requirements-gpu.txt)는 설치하지 않는다. GPU 없이 도는 테스트만 실행한다.
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # BE/app/ai_contract가 ai/src/career/contracts와 바이트 단위로 같은지 확인한다.
      - run: python scripts/sync_contract_to_be.py --check

  research-vc:
    name: research-vc (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-vc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: research-vc/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  fe:
    name: FE (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run lint
      # build = tsc -b(타입체크) + vite build
      - run: npm run build
