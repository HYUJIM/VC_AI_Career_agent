openapi: 3.1.0
info:
  title: VC 지갑 코어 API (Mock / fixture 모드)
  version: 0.1.0
  description: |
    검증 이력 지갑 코어(VC 파트)의 자격증명 조회·검증 API.
    지금은 논문 우선 개발 기간이라 DX Ledger 실제 API 대신 로컬 fixture(실제 Ed25519 서명 포함)로
    동작한다. 응답 스키마는 DX Ledger 연동 이후에도 그대로 유지될 계약이므로, BE/AI 팀은 이 스펙을
    기준으로 클라이언트를 만들어도 안전하다.

    핵심 원칙: `status` 쿼리 파라미터를 생략하면 항상 `verified` 자격증명만 내려간다.
    "근거 없는 스펙 기재 원천 차단" 요구사항을 문서가 아니라 API 기본값으로 강제하기 위함이다.
  contact:
    name: VC 파트
externalDocs:
  description: 서술형 데이터 인터페이스 가이드 (예시·에러 코드·계약 설명)
  url: ./API_GUIDE.md
servers:
  - url: http://localhost:4000
    description: 로컬 개발 서버 (fixture 모드)

tags:
  - name: health
    description: 서버 상태 확인
  - name: credentials
    description: 자격증명(CredentialRecord) 조회
  - name: skills
    description: 정규화된 공통 역량(SkillClaim) 조회
  - name: verify
    description: 온디맨드 재검증

paths:
  /health:
    get:
      tags: [health]
      summary: 서버 상태 및 로드된 레코드 수 확인
      operationId: getHealth
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                mode: fixture
                recordCount: 9

  /v1/subjects/{did}/credentials:
    get:
      tags: [credentials]
      summary: 특정 subject(사용자/학생)의 자격증명 목록 조회
      description: |
        `status` 쿼리를 생략하면 **항상 verified만** 반환한다. 미검증(위조·폐기·만료·미상 발급자 등)
        데이터를 받으려면 `?status=all` 또는 `?status=invalid,revoked`처럼 명시적으로 요청해야 한다.
      operationId: listCredentialsBySubject
      parameters:
        - $ref: "#/components/parameters/SubjectDid"
        - name: status
          in: query
          required: false
          description: |
            쉼표로 구분된 상태 목록, 또는 `all`(전체). 생략 시 기본값은 `verified`.
          schema:
            type: string
            examples: ["verified", "all", "invalid,revoked"]
      responses:
        "200":
          description: 자격증명 목록 (요약 필드만 포함, 전체 내용은 /v1/records/{id} 참조)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialListResponse"
              example:
                subject_did: "did:fixture:student-001"
                status_filter: ["verified"]
                count: 4
                records:
                  - record_id: "3f444a85-191b-51a4-83a6-73fad567c272"
                    format: "OB2.0"
                    achievement_name: "백엔드 개발 기초"
                    issuer_name: "ACME University"
                    status: "verified"
                    issued_at: "2026-03-01T00:00:00Z"

  /v1/records/{id}:
    get:
      tags: [credentials]
      summary: 단일 CredentialRecord 전체 조회
      description: status 필터가 적용되지 않는다. record_id만 알면 상태와 무관하게 조회된다(기업용 원클릭 검증 뷰 등 근거 확인 용도).
      operationId: getRecordById
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: CredentialRecord 전체
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/records/{id}/verification:
    get:
      tags: [credentials]
      summary: 특정 레코드의 VerificationResult만 조회
      description: 7개 체크(schema/did_resolution/signature/issuer_trust/revocation/anchor_match/expiration)가 항상 전부 포함된다.
      operationId: getVerificationByRecordId
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: VerificationResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/subjects/{did}/skills:
    get:
      tags: [skills]
      summary: subject의 정규화된 공통 역량(SkillClaim) 목록 조회
      description: |
        `verified` 상태 레코드에서 나온 스킬만 집계한다(미검증 데이터 기반 스킬은 절대 노출되지 않음).
        같은 skill_id가 여러 자격증명에서 나오면 하나로 합치고 `source_record_ids`에 근거를 모두 남긴다.
      operationId: listSkillsBySubject
      parameters:
        - $ref: "#/components/parameters/SubjectDid"
      responses:
        "200":
          description: SkillClaim 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"

  /v1/verify:
    post:
      tags: [verify]
      summary: external_id로 지정한 원본 자격증명을 그 자리에서 재검증
      description: |
        캐시된 값이 아니라 파이프라인을 즉시 재실행한다. AI 팀 MCP `wallet.verify_credential`
        툴이 감쌀 엔드포인트이며, 데모/디버깅 목적으로도 쓴다.
      operationId: verifyCredentialOnDemand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
            example:
              external_id: "cred-ob2-hosted-001"
      responses:
        "200":
          description: 재검증된 CredentialRecord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRecord"
        "400":
          description: external_id 누락 등 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "파이프라인 실행 중 처리 불가능한 오류 (예: 알 수 없는 자격증명 포맷)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    SubjectDid:
      name: did
      in: path
      required: true
      description: 조회 대상 subject의 DID
      schema:
        type: string
      example: "did:fixture:student-001"
    RecordId:
      name: id
      in: path
      required: true
      description: CredentialRecord.record_id (externalId 기반 결정적 UUID)
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [not_found, bad_request, verification_failed]
        message:
          type: string

    HealthResponse:
      type: object
      required: [status, mode, recordCount]
      properties:
        status:
          type: string
          enum: [ok, starting]
        mode:
          type: string
          enum: [fixture, dxledger]
        recordCount:
          type: integer

    VerifyRequest:
      type: object
      required: [external_id]
      properties:
        external_id:
          type: string

    CredentialListItem:
      type: object
      required: [record_id, format, issuer_name, status, issued_at]
      properties:
        record_id:
          type: string
          format: uuid
        format:
          $ref: "#/components/schemas/CredentialFormat"
        achievement_name:
          type: string
        issuer_name:
          type: string
        status:
          $ref: "#/components/schemas/VerificationStatus"
        issued_at:
          type: string
          format: date-time

    CredentialListResponse:
      type: object
      required: [subject_did, status_filter, count, records]
      properties:
        subject_did:
          type: string
        status_filter:
          type: array
          items:
            $ref: "#/components/schemas/VerificationStatus"
        count:
          type: integer
        records:
          type: array
          items:
            $ref: "#/components/schemas/CredentialListItem"

    SkillListResponse:
      type: object
      required: [subject_did, count, skills]
      properties:
        subject_did:
          type: string
        count:
          type: integer
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillClaim"

    CredentialFormat:
      type: string
      enum: ["OB2.0", "OB3.0", "VC1.1", "VC2.0"]

    CredentialProvider:
      type: string
      enum: [dx_ledger_wallet, dx_ledger_badge, hosted_url, upload]

    IssuerTrustLevel:
      type: string
      enum: [accredited, known, unknown]

    VerificationStatus:
      type: string
      enum: [verified, invalid, revoked, expired, unverifiable, pending]

    VerificationCheckName:
      type: string
      enum: [schema, did_resolution, signature, issuer_trust, revocation, anchor_match, expiration]

    VerificationCheckResult:
      type: string
      enum: [pass, fail, warn, skip]

    ProofType:
      type: string
      enum: ["VC-JWT", "DataIntegrityProof", "HostedVerification"]

    SkillMappingMethod:
      type: string
      enum: [exact_alignment, alias_dict, embedding_knn, manual]

    SkillLevelBasis:
      type: string
      enum: [assessed, completion, participation, declared]

    Source:
      type: object
      required: [provider, external_id, fetched_at]
      properties:
        provider:
          $ref: "#/components/schemas/CredentialProvider"
        external_id:
          type: string
        fetched_at:
          type: string
          format: date-time

    IssuerProfile:
      type: object
      required: [did, name, trust_level]
      properties:
        did:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        trust_level:
          $ref: "#/components/schemas/IssuerTrustLevel"

    Alignment:
      type: object
      properties:
        framework:
          type: string
        code:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri

    Achievement:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        criteria_narrative:
          type: string
        achievement_type:
          type: string
        image_url:
          type: string
        tags:
          type: array
          items:
            type: string
        alignments:
          type: array
          items:
            $ref: "#/components/schemas/Alignment"

    Evidence:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri

    SkillTaxonomyRef:
      type: object
      required: [source, code, version]
      properties:
        source:
          type: string
          enum: [NCS, ESCO, internal]
        code:
          type: string
        version:
          type: string

    SkillClaim:
      type: object
      required: [skill_id, label_ko, taxonomy, confidence, mapping_method, source_record_ids]
      properties:
        skill_id:
          type: string
        label_ko:
          type: string
        label_en:
          type: string
        taxonomy:
          $ref: "#/components/schemas/SkillTaxonomyRef"
        level:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        level_basis:
          $ref: "#/components/schemas/SkillLevelBasis"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        mapping_method:
          $ref: "#/components/schemas/SkillMappingMethod"
        source_record_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1

    VerificationCheck:
      type: object
      required: [check, result, checked_at]
      properties:
        check:
          $ref: "#/components/schemas/VerificationCheckName"
        result:
          $ref: "#/components/schemas/VerificationCheckResult"
        detail:
          type: string
        checked_at:
          type: string
          format: date-time

    Proof:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ProofType"
        alg:
          type: string
        verification_method:
          type: string

    Anchor:
      type: object
      properties:
        chain:
          type: ["string", "null"]
        tx_id:
          type: ["string", "null"]
        block_no:
          type: ["integer", "null"]
        anchored_hash:
          type: ["string", "null"]
        computed_hash:
          type: ["string", "null"]
        match:
          type: ["boolean", "null"]

    VerificationResult:
      type: object
      required: [status, checks, verified_at, verifier_version]
      properties:
        status:
          $ref: "#/components/schemas/VerificationStatus"
        checks:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/VerificationCheck"
        proof:
          $ref: "#/components/schemas/Proof"
        anchor:
          $ref: "#/components/schemas/Anchor"
        verified_at:
          type: string
          format: date-time
        verifier_version:
          type: string

    CredentialRecord:
      type: object
      required:
        - record_id
        - subject_did
        - schema_version
        - normalized_at
        - source
        - format
        - issuer
        - achievement
        - verification
        - raw_hash
      properties:
        record_id:
          type: string
          format: uuid
        subject_did:
          type: string
        schema_version:
          type: string
        normalized_at:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/Source"
        format:
          $ref: "#/components/schemas/CredentialFormat"
        issuer:
          $ref: "#/components/schemas/IssuerProfile"
        achievement:
          $ref: "#/components/schemas/Achievement"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: ["string", "null"]
          format: date-time
        awarded_date:
          type: ["string", "null"]
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillClaim"
        verification:
          $ref: "#/components/schemas/VerificationResult"
        raw_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
